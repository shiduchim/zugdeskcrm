<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>Shidduch calls</title>
<style>
:root{--bg:#EEF2F6;--card:#FFF;--ink:#1B2733;--muted:#5B6B7B;--line:#D3DCE5;--blue:#2B67A8;--blue-ink:#FFF;--green:#2F7A4F;--green-ink:#FFF;--green-soft:#DDF0E4;--amber:#9A6A12;--amber-soft:#F6EBD3;--red:#A23B32;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#121A22;--card:#1B2631;--ink:#E6EDF3;--muted:#9AAABA;--line:#2C3A48;--blue:#5B9BE0;--blue-ink:#0E1620;--green:#6BC28F;--green-ink:#0E1620;--green-soft:#1C3328;--amber:#E0B35E;--amber-soft:#3A2F1A;--red:#E58A80;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 -apple-system,"Segoe UI",Rubik,Arial,sans-serif}
main{max-width:640px;margin:0 auto;padding:12px 16px 80px}
h1{font-size:21px;margin:6px 0 2px}
.muted{color:var(--muted);font-size:15px}
button,.btn{min-height:48px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:16px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.on{background:var(--blue);color:var(--blue-ink);border-color:var(--blue)}
.primary{background:var(--blue);color:var(--blue-ink);border-color:var(--blue);font-weight:600}
.good{background:var(--green);color:var(--green-ink);border-color:var(--green)}
button:disabled{opacity:.45;cursor:default}
.quiet{border-color:transparent;background:transparent;color:var(--muted)}
.danger{color:var(--red)}
input,textarea,select{width:100%;font:inherit;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
textarea{min-height:76px}
select{margin-bottom:10px;min-height:44px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.bar > *{flex:1 1 auto;width:auto;margin:0;min-height:44px}
.bar select{flex:1 1 150px}
.bar > *{flex:1 1 0}
.chipsf{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.fchip{min-height:44px;padding:6px 12px;border-radius:999px;font-size:15px;background:var(--bg)}
.fchip svg,.slash{width:16px;height:16px;flex:none;opacity:.7}
#shade{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30}
#sheet{position:fixed;z-index:31;inset-inline:0;bottom:0;max-height:85dvh;display:flex;flex-direction:column;background:var(--card);color:var(--ink);border-radius:18px 18px 0 0;box-shadow:0 -6px 30px rgba(0,0,0,.2)}
@media (min-width:900px){#sheet{inset-inline-start:auto;inset-inline-end:0;top:0;bottom:0;max-height:none;width:400px;border-radius:0}}
.sh-head,.sh-foot{display:flex;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.sh-head b{flex:1;font-size:19px}
.sh-foot{border-bottom:0;border-top:1px solid var(--line);padding-bottom:calc(12px + env(safe-area-inset-bottom))}
.sh-foot .primary{flex:1}
.sh-body{overflow:auto;padding:4px 16px 12px;overscroll-behavior:contain}
.sh-body h4{margin:16px 0 6px;font-size:16px}
.opt{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 4px;margin:0;color:var(--ink);font-size:16px;cursor:pointer}
.opt input{width:22px;height:22px;flex:none;margin:0}
.opt span{flex:1;unicode-bidi:isolate}
.opt small{color:var(--muted)}
.opt.zero{opacity:.45}
body.lock{overflow:hidden}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.card.busy{opacity:.55}
.name{font-size:19px;font-weight:600;margin:0 0 2px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.row > *{flex:1 1 auto}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{background:var(--green-soft);color:var(--green);border-radius:999px;padding:2px 10px;font-size:14px}
.tag{background:var(--amber-soft);color:var(--amber);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:15px}
.script{white-space:pre-wrap;background:var(--bg);border-radius:12px;padding:12px;margin-top:8px;display:none}
.script.open{display:block}
label{display:block;margin:12px 0 4px;font-size:15px;color:var(--muted)}
.sel{outline:3px solid var(--blue);outline-offset:1px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
.toast.show{opacity:1}
.center{text-align:center;padding:40px 10px}
.top{display:flex;align-items:center;gap:10px;margin:4px 0 2px}
.top h1{flex:1;margin:0}
.trsw{display:inline-flex;height:32px;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none;background:var(--card)}
.trsw button{min-height:0;height:100%;padding:0 12px;border:0;border-radius:0;font-size:13px;background:transparent}
.trsw button.on{background:var(--blue);color:var(--blue-ink)}
.seg{display:flex;gap:4px;padding:4px;background:var(--line);border-radius:14px;position:sticky;top:0;z-index:5;margin:10px 0 4px;box-shadow:0 0 0 8px var(--bg)}
.seg button{flex:1;border:0;background:transparent;font-weight:600;color:var(--muted);min-height:48px;border-radius:10px}
.seg button.cur{background:var(--card);color:var(--blue);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.links{display:flex;flex-wrap:wrap;gap:4px 16px;margin:0 0 4px}
.links button{min-height:44px;padding:4px 2px;border:0;background:transparent;color:var(--blue);text-decoration:underline;text-underline-offset:3px;font-size:15px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.card .row .primary{min-height:52px;font-size:17px}
.fchip.on{background:var(--blue);color:var(--blue-ink);border-color:var(--blue)}
.orig{font-size:14px;margin:-2px 0 2px}
</style>
</head>
<body>
<main id="app" data-k=""><div class="center muted">…</div></main>
<div class="toast" id="toast"></div>
<script>
// Two ways to run: inside Apps Script (google.script.run, key from the template) or as a static page (fetch, key from #k=).
const EXEC_URL = 'https://script.google.com/macros/s/AKfycbxjzT6OUMaH1CIajHS09t53rN7A-XYc0cX6fTv9KSZoMMOWy6pg1vhPuUpHuxTMV8Sh/exec';
const INSIDE = typeof google !== 'undefined' && google.script && google.script.run;
const KEY = (INSIDE ? document.getElementById('app').dataset.k : (location.hash.match(/k=([A-Za-z0-9]+)/) || [])[1] || '').replace(/[^A-Za-z0-9]/g, '').slice(0, 64);
const L = {
 RU:{title:'Звонки шадханам',listOf:'Список: {name}',hello:'Здравствуйте, {name}!',mine:'Мои звонки',all:'Список',search:'Поиск: имя, город…',call:'Позвонить',wa:'WhatsApp',
   script:'Что сказать',profile:'Скопировать данные Элияху',copied:'Скопировано',busy:'{name} уже звонит',tip:'Заметка',giveBack:'Не буду звонить — вернуть в общий список',gaveBack:'Возвращено в общий список',
   save:'Сохранить',saved:'Сохранено, спасибо!',notes:'Что узнали (можно голосом — значок микрофона на клавиатуре)',names:'Имена и телефоны других шадханов, если дали',
   nextQ:'Что дальше?',next_profile:'Отправить данные Элияху',next_call:'Пусть Элияху позвонит',next_:'Ничего',
   res_spoke:'Поговорили',res_noanswer:'Не ответили',res_callback:'Перезвонить позже',res_wrong:'Неверный номер',res_inactive:'Больше не занимается',res_stop:'Просили не звонить',
   pick:'Выберите результат',hours:'Часы',empty:'Сейчас некого звонить. Спасибо!',emptyMine:'Нажмите «Позвонить» в списке — человек появится здесь.',
   more:'Показать ещё',link:'Ссылка не работает. Попросите новую у Элияху.',err:'Что-то пошло не так: ',taken:'{name} уже взял(а) этого человека',orig:'Оригинал',trans:'Русский',sort:'Сортировка',s_best:'Лучшие сначала',s_city:'Город',s_name:'Имя',s_ru:'Русскоязычные сначала',s_src:'Источник',filters:'Фильтры',done:'Готово',reset:'Сбросить',showN:'Показать: {n}',findCity:'Найти город',g_city:'Город',g_country:'Страна',c_unknown:'Не указана',g_lang:'Язык',g_src:'Источник',g_more:'Ещё',remove:'Убрать',filter:'Фильтр',f_city:'Все города',f_lang:'Все языки',f_src:'Все источники',f_mob:'Только мобильные',f_clear:'Сбросить фильтры',lg_ru:'Русский',lg_en:'Английский',lg_he:'Иврит',lg_yi:'Идиш',lg_fr:'Французский',lg_es:'Испанский'},
 HE:{title:'שיחות לשדכנים',listOf:'הרשימה של {name}',hello:'שלום {name}!',mine:'השיחות שלי',all:'רשימה',search:'חיפוש: שם, עיר…',call:'להתקשר',wa:'וואטסאפ',
   script:'מה לומר',profile:'להעתיק את הפרטים של אליהו',copied:'הועתק',busy:'{name} כבר מתקשר/ת',tip:'הערה',giveBack:'לא אתקשר — להחזיר לרשימה הכללית',gaveBack:'הוחזר לרשימה הכללית',
   save:'שמירה',saved:'נשמר, תודה!',notes:'מה נאמר (אפשר בקול – המיקרופון במקלדת)',names:'שמות וטלפונים של שדכנים נוספים, אם נתנו',
   nextQ:'מה הלאה?',next_profile:'לשלוח את הפרטים של אליהו',next_call:'שאליהו יתקשר',next_:'כלום',
   res_spoke:'דיברנו',res_noanswer:'לא ענו',res_callback:'להתקשר שוב אחר כך',res_wrong:'מספר שגוי',res_inactive:'כבר לא פעיל/ה',res_stop:'ביקשו לא להתקשר',
   pick:'בחר/י תוצאה',hours:'שעות',empty:'אין כרגע למי להתקשר. תודה!',emptyMine:'לחצו "להתקשר" ברשימה – האדם יופיע כאן.',
   more:'עוד',link:'הקישור לא פעיל. בקשו קישור חדש מאליהו.',err:'משהו השתבש: ',taken:'{name} כבר לקח/ה את האדם הזה',sort:'מיון',s_best:'הכי מתאימים קודם',s_city:'עיר',s_name:'שם',s_ru:'דוברי רוסית קודם',s_src:'מקור',filters:'סינון',done:'סיום',reset:'איפוס',showN:'הצגת {n}',findCity:'חיפוש עיר',g_city:'עיר',g_country:'מדינה',c_unknown:'לא ידוע',g_lang:'שפה',g_src:'מקור',g_more:'עוד',remove:'הסרה',filter:'סינון',f_city:'כל הערים',f_lang:'כל השפות',f_src:'כל המקורות',f_mob:'רק ניידים',f_clear:'ניקוי סינון',lg_ru:'רוסית',lg_en:'אנגלית',lg_he:'עברית',lg_yi:'יידיש',lg_fr:'צרפתית',lg_es:'ספרדית'},
 EN:{title:'Shadchan calls',listOf:"{name}'s list",hello:'Hello {name}!',mine:'My calls',all:'List',search:'Search: name, city…',call:'Call',wa:'WhatsApp',
   script:'What to say',profile:'Copy Eliyahu\'s details',copied:'Copied',busy:'{name} is calling',tip:'Note',giveBack:"I won't call — put back in the main list",gaveBack:'Back in the main list',
   save:'Save',saved:'Saved, thank you!',notes:'What you heard (you can speak it: microphone on the keyboard)',names:'Names and numbers of other shadchanim, if they gave any',
   nextQ:'What next?',next_profile:'Send Eliyahu\'s details',next_call:'Eliyahu should call',next_:'Nothing',
   res_spoke:'We spoke',res_noanswer:'No answer',res_callback:'Call back later',res_wrong:'Wrong number',res_inactive:'Not active anymore',res_stop:'Asked not to call',
   pick:'Pick a result',hours:'Hours',empty:'Nobody to call right now. Thank you!',emptyMine:'Tap "Call" in the list and the person appears here.',
   more:'Show more',link:'This link is not active. Ask Eliyahu for a new one.',err:'Something went wrong: ',taken:'{name} already took this person',orig:'Original',trans:'English',sort:'Sort',s_best:'Best match first',s_city:'City',s_name:'Name',s_ru:'Russian speakers first',s_src:'Source',filters:'Filters',done:'Done',reset:'Reset',showN:'Show {n} people',findCity:'Find a city',g_city:'City',g_country:'Country',c_unknown:'Unknown',g_lang:'Language',g_src:'Source',g_more:'More',remove:'Remove',filter:'Filter',f_city:'All cities',f_lang:'All languages',f_src:'All sources',f_mob:'Mobile only',f_clear:'Clear filters',lg_ru:'Russian',lg_en:'English',lg_he:'Hebrew',lg_yi:'Yiddish',lg_fr:'French',lg_es:'Spanish'}
};
let showTr = true; try { showTr = localStorage.getItem('h_tr') !== '0'; } catch(e){}
let sortBy = 'best'; try { sortBy = localStorage.getItem('h_sort') || 'best'; } catch(e){}
const FL0 = () => ({country:[], city:[], lang:[], src:[], mob:false});
let fl = FL0(); try { const o = JSON.parse(localStorage.getItem('h_fl') || '{}'); ['country','city','lang','src'].forEach(k => fl[k] = [].concat(o[k] || []).filter(Boolean)); fl.mob = !!o.mob; } catch(e){}
if (['best','city','name'].indexOf(sortBy) < 0) sortBy = 'best';
let sheetOpen = false;
const LANGS = {ru:'ר', en:'א', he:'ע', yi:'י', fr:'צ', es:'ס'};
let D = null, tab = 'all', q = '', shown = 40, lang = 'HE';
const form = {};   // id → {result, next}
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const run = (fn, ...a) => INSIDE
  ? new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](KEY, ...a))
  : fetch(EXEC_URL, { method: 'POST', credentials: 'omit', redirect: 'follow', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ fn: fn, k: KEY, args: a }) })
      .then(r => r.json()).then(j => { if (!j.ok) throw new Error(j.error || 'error'); return j.data; });
function t(key, map){ let s = (D && D.texts[key + '_' + lang]) || (L[lang] || L.HE)[key] || L.EN[key] || key;
  Object.keys(map||{}).forEach(k => s = s.split('{'+k+'}').join(map[k])); return s; }
function toast(m){ const x=$('#toast'); x.textContent=m; x.classList.add('show'); clearTimeout(x._h); x._h=setTimeout(()=>x.classList.remove('show'),2600); }
function fail(e){ const m = String(e && e.message || e); if (/LINK/.test(m)) return showLink(); toast(t('err') + m); }
function showLink(){ $('#app').innerHTML = `<div class="center">${esc(t('link'))}</div>`; }

async function load(){
  try { D = await run('h_load'); lang = D.me.lang; document.documentElement.dir = lang === 'HE' ? 'rtl' : 'ltr'; document.documentElement.lang = lang.toLowerCase(); startF(); dropStale(); render(); updateSheet(); }
  catch(e){ fail(e); }
}
function busyTyping(){ return sheetOpen || Object.values(form).some(f => f.result || f.notes || f.names) || (document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName) && document.activeElement.id !== 'q'); }
setInterval(() => { if (document.visibilityState === 'visible' && D && !busyTyping()) load(); }, 60000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && D && !busyTyping()) load(); });

function render(){
  const mine = D.items.filter(x => x.mine);
  const ql = q.toLowerCase();
  const list = D.items.filter(x => !x.mine && passes(x) && (!ql || (x.name + ' ' + x.city + ' ' + x.spec + ' ' + (x.tr ? x.tr.name + ' ' + x.tr.city + ' ' + x.tr.spec : '')).toLowerCase().indexOf(ql) >= 0))
    .map((x, i) => Object.assign(x, { rank: i })).sort(sorter());
  const hasTr = D.items.some(x => x.tr);
  let h = `<div class="top"><h1 dir="auto">${esc(t('listOf', {name: D.me.name}))}</h1>` +
    (hasTr ? `<div class="trsw"><button class="${!showTr?'on':''}" aria-pressed="${!showTr}" onclick="setTr(false)">${esc(t('orig'))}</button><button class="${showTr?'on':''}" aria-pressed="${showTr}" onclick="setTr(true)">${esc(t('trans'))}</button></div>` : '') + `</div>
    <div class="seg" role="tablist"><button role="tab" aria-selected="${tab==='mine'}" class="${tab==='mine'?'cur':''}" onclick="setTab('mine')">${esc(t('mine'))} (${mine.length})</button>
      <button role="tab" aria-selected="${tab==='all'}" class="${tab==='all'?'cur':''}" onclick="setTab('all')">${esc(t('all'))} (${list.length})</button></div>
    <div class="links"><button onclick="toggle('scr')">${esc(t('script'))}</button>${D.profile ? `<button onclick="copyProfile()">${esc(t('profile'))}</button>` : ''}</div>
    <div class="script" id="scr" dir="auto">${esc(scriptText())}</div>`;
  if (tab === 'mine') h += mine.length ? mine.map(cardHtml).join('') : `<div class="center muted">${esc(t('emptyMine'))}</div>`;
  else {
    h += `<input id="q" dir="auto" placeholder="${esc(t('search'))}" value="${esc(q)}" oninput="q=this.value;shown=40;renderKeep()">`;
    h += barHtml();
    h += list.length ? list.slice(0, shown).map(cardHtml).join('') : `<div class="center muted">${esc(t('empty'))}${nFl() ? `<div class="row"><button onclick="clearF()">${esc(t('f_clear'))}</button></div>` : ''}</div>`;
    if (list.length > shown) h += `<div class="row"><button onclick="shown+=40;render()">${esc(t('more'))}</button></div>`;
  }
  $('#app').innerHTML = h;
}
function renderKeep(){ const p = $('#q') && $('#q').selectionStart; render(); const i = $('#q'); if (i){ i.focus(); try{ i.setSelectionRange(p,p); }catch(e){} } }
// sorting: busy people last; then the chosen order; best match breaks ties (rank = order from the main app)
function shown_(x, f){ return (showTr && x.tr && x.tr[f]) || x[f] || ''; }
function sorter(){
  const by = sortBy, ru = x => /ר/.test(x.langs || '') || /רוס/.test(x.spec || '') ? 0 : 1;
  const cmp = (a, b) => a.localeCompare(b, lang === 'RU' ? 'ru' : lang === 'HE' ? 'he' : 'en');
  return (a, b) => ((a.by ? 1 : 0) - (b.by ? 1 : 0)) ||
    (by === 'city' ? cmp(shown_(a,'city') || '\uffff', shown_(b,'city') || '\uffff') :
     by === 'name' ? cmp(shown_(a,'name'), shown_(b,'name')) :
     by === 'ru' || (by === 'best' && lang === 'RU') ? ru(a) - ru(b) :   // Russian-speaking helpers: Russian speakers first, then best match
     by === 'src' ? cmp(a.src || '\uffff', b.src || '\uffff') : 0) || (a.rank - b.rank);
}
// filters: one Filters button opens a sheet (bottom on phone, side on PC); list updates live; tags above the list remove one filter
const SLASH = '<svg class="slash" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.6"/><line x1="3.6" y1="12.4" x2="12.4" y2="3.6" stroke="currentColor" stroke-width="1.6"/></svg>';
// country: the contact's Country field, else from the phone code
const CTRY = [['Israel',/^(israel|isr|il|ישראל|израиль)$/],['USA',/^(usa|us|u\.s\.a?\.?|united states|america|сша|ארה"?ב|ארה״ב|ארצות הברית)$/],['Canada',/^(canada|канада|קנדה)$/],
  ['UK',/^(uk|u\.k\.|england|united kingdom|great britain|англия|великобритания|אנגליה|בריטניה)$/],['Russia',/^(russia|россия|רוסיה)$/],['Ukraine',/^(ukraine|украина|אוקראינה)$/],['France',/^(france|франция|צרפת)$/]];
const CTRY_L = {Israel:['Израиль','ישראל'],USA:['США','ארה״ב'],Canada:['Канада','קנדה'],UK:['Великобритания','בריטניה'],Russia:['Россия','רוסיה'],Ukraine:['Украина','אוקראינה'],France:['Франция','צרפת']};
function countryOf(x){
  const s = String(x.country || '').trim();
  if (s) { const m = CTRY.find(c => c[1].test(s.toLowerCase())); return m ? m[0] : s; }
  const d = String(((x.phones || [])[0] || {}).tel || '').replace(/\D/g, '');
  return /^972/.test(d) ? 'Israel' : /^1/.test(d) ? 'USA' : '?';
}
function countryLabel(v){ if (v === '?') return t('c_unknown'); const l = CTRY_L[v]; return l ? (lang === 'RU' ? l[0] : lang === 'HE' ? l[1] : v) : v; }
const isMob = x => (x.phones || []).some(p => p.mobile);
const hasLang = (x, k) => (x.langs || '').indexOf(LANGS[k]) >= 0;
function passes(x, skip){
  return (skip === 'country' || !fl.country.length || fl.country.indexOf(countryOf(x)) >= 0) &&
    (skip === 'city' || !fl.city.length || fl.city.indexOf(x.city) >= 0) &&
    (skip === 'lang' || !fl.lang.length || fl.lang.some(k => hasLang(x, k))) &&
    (skip === 'src' || !fl.src.length || fl.src.indexOf(x.src) >= 0) &&
    (skip === 'mob' || !fl.mob || isMob(x));
}
const nFl = () => fl.country.length + fl.city.length + fl.lang.length + fl.src.length + (fl.mob ? 1 : 0);
const free_ = () => D.items.filter(x => !x.mine);
function cityLabel(c){ const x = D.items.find(i => i.city === c && i.tr && i.tr.city); return (showTr && x) ? x.tr.city : c; }
function groups(){   // [key, title, [[value, label]]]
  const free = free_(), cmp = (a, b) => a[1].localeCompare(b[1], lang === 'RU' ? 'ru' : lang === 'HE' ? 'he' : 'en');
  const cities = Array.from(new Set(free.map(x => x.city).filter(Boolean))).map(c => [c, cityLabel(c)]).sort(cmp);
  const langs = Object.keys(LANGS).filter(k => free.some(x => hasLang(x, k))).map(k => [k, t('lg_' + k)]);
  const srcs = Array.from(new Set(free.map(x => x.src).filter(Boolean))).sort().map(v => [v, v]);
  const cn = {}; free.forEach(x => { const c = countryOf(x); cn[c] = (cn[c] || 0) + 1; });
  const ctrs = Object.keys(cn).sort((a, b) => (a === '?') - (b === '?') || cn[b] - cn[a]).map(v => [v, countryLabel(v)]);
  return [['country', t('g_country'), ctrs.length > 1 || fl.country.length ? ctrs : []], ['lang', t('g_lang'), langs], ['src', t('g_src'), srcs], ['city', t('g_city'), cities]].filter(g => g[2].length);
}
function count(key, val){ return free_().filter(x => passes(x, key) && (key === 'country' ? countryOf(x) === val : key === 'city' ? x.city === val : key === 'src' ? x.src === val : key === 'lang' ? hasLang(x, val) : isMob(x))).length; }
function resultCount(){ return free_().filter(x => passes(x)).length; }
function barHtml(){
  const n = nFl(), quickRu = lang === 'RU' && free_().some(x => hasLang(x, 'ru')), ru = fl.lang.indexOf('ru') >= 0;
  let h = `<div class="bar"><button class="${n?'on':''}" onclick="openSheet()">${esc(t('filters'))}${n ? ' (' + n + ')' : ''}</button>
    <select aria-label="${esc(t('sort'))}" onchange="setSort(this.value)">${['best','city','name'].map(o =>
      `<option value="${o}" ${sortBy===o?'selected':''}>${esc(t('s_'+o))}</option>`).join('')}</select>
</div>`;
  h += `<div class="chipsf"><button class="fchip ${fl.mob?'on':''}" aria-pressed="${fl.mob}" onclick="setF('mob')">${esc(t('f_mob'))}</button>` +
    (quickRu ? `<button class="fchip ${ru?'on':''}" aria-pressed="${ru}" onclick="setF('lang','ru')">${esc(t('lg_ru'))}</button>` : '');
  {
    const tag = (k, v, label) => `<button class="fchip" aria-label="${esc(t('remove') + ': ' + label)}" onclick="setF('${k}',${v == null ? 'null' : esc(JSON.stringify(v))})"><span dir="auto">${esc(label)}</span>${SLASH}</button>`;
    h += fl.country.map(v => tag('country', v, countryLabel(v))).join('') + fl.lang.filter(v => !(quickRu && v === 'ru')).map(v => tag('lang', v, t('lg_' + v))).join('') + fl.src.map(v => tag('src', v, v)).join('') +
      fl.city.map(v => tag('city', v, cityLabel(v))).join('') + (n ? `<button class="quiet" onclick="clearF()">${esc(t('f_clear'))}</button>` : '') + `</div>`;
  }
  return h;
}
function sheetHtml(){
  let h = `<div class="sh-head"><b>${esc(t('filters'))}</b><button class="primary" onclick="closeSheet()">${esc(t('done'))}</button></div><div class="sh-body">`;
  groups().forEach(g => {
    h += `<h4>${esc(g[1])}</h4>`;
    if (g[0] === 'city' && g[2].length > 8) h += `<input id="cityq" dir="auto" placeholder="${esc(t('findCity'))}" oninput="findCity(this.value)" style="margin-bottom:6px">`;
    h += g[2].map(o => `<label class="opt" data-k="${g[0]}" data-v="${esc(o[0])}" data-l="${esc(String(o[1]).toLowerCase())}"><input type="checkbox" ${fl[g[0]].indexOf(o[0])>=0?'checked':''} onchange="setF('${g[0]}',this.parentNode.dataset.v)"><span>${esc(o[1])}</span><small></small></label>`).join('');
  });
  h += `<h4>${esc(t('g_more'))}</h4><label class="opt" data-k="mob"><input type="checkbox" ${fl.mob?'checked':''} onchange="setF('mob')"><span>${esc(t('f_mob'))}</span><small></small></label>`;
  h += `</div><div class="sh-foot"><button onclick="clearF()">${esc(t('reset'))}</button><button class="primary" id="shown" onclick="closeSheet()"></button></div>`;
  return h;
}
function updateSheet(){   // counts and ticks in place, so the city search keeps focus
  if (!sheetOpen) return;
  document.querySelectorAll('#sheet .opt').forEach(el => {
    const k = el.dataset.k, v = el.dataset.v, n = count(k, v);
    el.querySelector('small').textContent = n; el.classList.toggle('zero', !n);
    el.querySelector('input').checked = k === 'mob' ? fl.mob : fl[k].indexOf(v) >= 0;
  });
  $('#shown').textContent = t('showN', {n: resultCount()});
}
function findCity(q){ q = q.trim().toLowerCase(); document.querySelectorAll('#sheet .opt[data-k="city"]').forEach(el => el.style.display = !q || el.dataset.l.indexOf(q) >= 0 || el.dataset.v.indexOf(q) >= 0 ? '' : 'none'); }
function openSheet(){
  if (sheetOpen) return; sheetOpen = true;
  const sh = document.createElement('div'); sh.id = 'shade'; sh.onclick = () => closeSheet(); document.body.appendChild(sh);
  const el = document.createElement('div'); el.id = 'sheet'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); el.innerHTML = sheetHtml(); document.body.appendChild(el);
  document.body.classList.add('lock'); updateSheet();
  try { history.pushState({sheet: 1}, ''); } catch(e){}
  el.querySelector('.sh-head button').focus();
}
function hideSheet(){
  if (!sheetOpen) return; sheetOpen = false;
  ['#sheet', '#shade'].forEach(s => { const e = $(s); if (e) e.remove(); });
  document.body.classList.remove('lock');
}
function closeSheet(){   // Done / outside tap / Esc: go back one step so the phone's back button stays in sync
  if (!sheetOpen) return;
  if (history.state && history.state.sheet) { try { history.back(); return; } catch(e){} }
  hideSheet();
}
window.addEventListener('popstate', hideSheet);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
function saveF(){ shown = 40; try { localStorage.setItem('h_fl', JSON.stringify(fl)); } catch(e){} render(); updateSheet(); }
function setF(k, v){
  if (k === 'mob') fl.mob = !fl.mob;
  else { const a = fl[k], i = a.indexOf(v); if (i >= 0) a.splice(i, 1); else a.push(v); }
  saveF();
}
function clearF(){ fl = FL0(); saveF(); }
function startF(){   // once per phone: Russian-speaking helpers start with Book + Russian + English ticked (they can untick)
  try { if (localStorage.getItem('h_start2') === '1') return; localStorage.setItem('h_start2', '1'); } catch(e){ return; }
  if (lang !== 'RU') return;
  fl.lang = ['ru', 'en']; fl.src = free_().some(x => x.src === 'Book') ? ['Book'] : []; saveF();
}
function dropStale(){   // remembered filters that no longer exist in the list
  const free = free_();
  fl.country = fl.country.filter(c => free.some(x => countryOf(x) === c)); fl.city = fl.city.filter(c => free.some(x => x.city === c)); fl.src = fl.src.filter(v => free.some(x => x.src === v)); fl.lang = fl.lang.filter(k => LANGS[k]);
}
function setSort(v){ sortBy = v; shown = 40; try { localStorage.setItem('h_sort', v); } catch(e){} render(); }
function setTr(v){ showTr = v; try { localStorage.setItem('h_tr', v ? '1' : '0'); } catch(e){} render(); }
function setTab(x){ tab = x; render(); window.scrollTo(0,0); }
// the call script is in the Texts tab of the helpers' sheet (SCRIPT_RU / SCRIPT_HE / SCRIPT_EN)
function scriptText(){ return (D.texts['SCRIPT_' + lang] || D.texts.SCRIPT_HE || '').split('{helper}').join(D.me.name); }
function toggle(id){ $('#'+id).classList.toggle('open'); }

function cardHtml(x){
  const orig = showTr && x.tr && x.tr.name && x.tr.name.trim() !== String(x.name).trim() ? x.name : '';
  if (showTr && x.tr) x = Object.assign({}, x, { name: x.tr.name || x.name, city: x.tr.city || x.city, spec: x.tr.spec || x.spec, why: x.tr.why || x.why });
  const lc = Array.from(String(x.langs || '')).filter(c => /[^\s,.]/.test(c)), lk = lc.map(c => Object.keys(LANGS).find(k => LANGS[k] === c));
  const lw = lk.length && lk.every(Boolean) ? lk.map(k => t('lg_' + k)).join(', ') : x.langs;   // book letters → words
  const meta = [x.city, lw, sortBy === 'src' ? x.src : ''].filter(Boolean).map(esc).join(' • ');
  let h = `<div class="card ${x.by?'busy':''}" id="c-${x.id}">
    <p class="name" dir="auto">${esc(x.name)}</p>${orig?`<div class="muted orig" dir="auto">${esc(orig)}</div>`:''}${meta?`<div class="muted" dir="auto">${meta}</div>`:''}
    ${x.hours?`<div class="muted" dir="auto">${esc(t('hours'))}: ${esc(x.hours)}</div>`:''}
    ${x.spec?`<div dir="auto" style="margin-top:4px">${esc(x.spec)}</div>`:''}
    ${x.why?`<div class="chips">${x.why.split(' · ').map(w=>`<span class="chip" dir="auto">${esc(w)}</span>`).join('')}</div>`:''}
    ${x.tip?`<div class="tag" dir="auto">${esc(t('tip'))} – ${esc(x.tip)}</div>`:''}`;
  if (x.by) return h + `<div class="tag">${esc(t('busy', {name: x.by}))}</div></div>`;
  h += `<div class="row">${x.phones.map(p => `<a class="btn primary" href="tel:${esc(p.tel)}" onclick="hold('${x.id}')">${esc(t('call'))} ${esc(p.local)}</a>`).join('')}
    ${x.phones.filter(p=>p.mobile).slice(0,1).map(p => `<a class="btn" href="https://wa.me/${esc(p.tel.replace('+',''))}" target="_blank" onclick="hold('${x.id}')">${esc(t('wa'))}</a>`).join('')}</div>`;
  if (x.mine) {
    const f = form[x.id] || {};
    h += `<label>${esc(t('pick'))}</label><div class="grid2">${['spoke','noanswer','callback','wrong','inactive','stop'].map(r =>
      `<button class="${f.result===r?'sel on':''}" onclick="pickRes('${x.id}','${r}')">${esc(t('res_'+r))}</button>`).join('')}</div>`;
    if (f.result === 'spoke') h += `<label>${esc(t('nextQ'))}</label><div class="grid2">${['profile','call',''].map(n =>
      `<button class="${(f.next||'')===n?'sel on':''}" onclick="pickNext('${x.id}','${n}')">${esc(t('next_'+n))}</button>`).join('')}</div>`;
    h += `<label for="n-${x.id}">${esc(t('notes'))}</label><textarea id="n-${x.id}" dir="auto" oninput="keep('${x.id}')">${esc(f.notes||'')}</textarea>
      ${f.result === 'spoke' ? `<label for="m-${x.id}">${esc(t('names'))}</label><textarea id="m-${x.id}" dir="auto" oninput="keep('${x.id}')">${esc(f.names||'')}</textarea>` : ''}
      <div class="row"><button class="good" onclick="save('${x.id}')" ${f.result?'':'disabled'}>${esc(t('save'))}</button></div>
      <div class="row"><button class="quiet" onclick="giveBack('${x.id}')">${esc(t('giveBack'))}</button></div>`;
  }
  return h + `</div>`;
}

function keep(id){ const f = form[id] = form[id] || {}; f.notes = $('#n-'+id).value; if ($('#m-'+id)) f.names = $('#m-'+id).value; }
function pickRes(id, r){ keep(id); form[id].result = r; if (r !== 'spoke') form[id].next = ''; render(); }
function pickNext(id, n){ keep(id); form[id].next = n; render(); }

function hold(id){
  const x = D.items.find(i => i.id === id); if (!x || x.mine) return;
  x.mine = true; form[id] = form[id] || {};
  run('h_reserve', id).then(r => { if (!r.ok){ x.mine = false; x.by = r.by; delete form[id]; toast(t('taken', {name: r.by})); render(); } }).catch(fail);
  setTimeout(() => { tab = 'mine'; render(); }, 400);
}
async function giveBack(id){
  try { await run('h_release', id); delete form[id]; const x = D.items.find(i => i.id === id); if (x) x.mine = false; render(); toast(t('gaveBack')); }
  catch(e){ fail(e); }
}
async function save(id){
  keep(id); const f = form[id]; if (!f || !f.result) return toast(t('pick'));
  const b = document.querySelector('#c-'+id+' .good'); if (b) b.disabled = true;
  try { await run('h_save', id, f.result, f.next || '', f.notes || '', f.names || '');
    delete form[id]; D.items = D.items.filter(i => i.id !== id); toast(t('saved')); render(); }
  catch(e){ if (b) b.disabled = false; fail(e); }
}
function copyProfile(){
  const done = () => toast(t('copied'));
  if (navigator.clipboard) navigator.clipboard.writeText(D.profile).then(done, () => fallback());
  else fallback();
  function fallback(){ const a = document.createElement('textarea'); a.value = D.profile; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove(); done(); }
}
load();
</script>
</body>
