<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>Shidduch calls</title>
<style>
:root{--bg:#EEF2F6;--card:#FFF;--ink:#1B2733;--muted:#5B6B7B;--line:#D3DCE5;--blue:#2B67A8;--blue-ink:#FFF;--green:#2F7A4F;--green-soft:#DDF0E4;--amber:#9A6A12;--amber-soft:#F6EBD3;--red:#A23B32;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#121A22;--card:#1B2631;--ink:#E6EDF3;--muted:#9AAABA;--line:#2C3A48;--blue:#5B9BE0;--blue-ink:#0E1620;--green:#6BC28F;--green-soft:#1C3328;--amber:#E0B35E;--amber-soft:#3A2F1A;--red:#E58A80;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 -apple-system,"Segoe UI",Rubik,Arial,sans-serif}
main{max-width:640px;margin:0 auto;padding:12px 16px 80px}
h1{font-size:21px;margin:6px 0 2px}
.muted{color:var(--muted);font-size:15px}
.tabs{display:flex;gap:8px;margin:14px 0 10px}
.tabs button{flex:1}
button,.btn{min-height:48px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:16px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.on{background:var(--blue);color:var(--blue-ink);border-color:var(--blue)}
.primary{background:var(--blue);color:var(--blue-ink);border-color:var(--blue);font-weight:600}
.good{background:var(--green);color:#fff;border-color:var(--green)}
.quiet{border-color:transparent;background:transparent;color:var(--muted)}
.danger{color:var(--red)}
input,textarea{width:100%;font:inherit;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
textarea{min-height:76px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.card.busy{opacity:.55}
.name{font-size:19px;font-weight:600;margin:0 0 2px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.row > *{flex:1 1 auto}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{background:var(--green-soft);color:var(--green);border-radius:999px;padding:2px 10px;font-size:14px}
.tag{background:var(--amber-soft);color:var(--amber);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:15px}
.script{white-space:pre-wrap;background:var(--bg);border-radius:12px;padding:12px;margin-top:8px;display:none}
.script.open{display:block}
label{display:block;margin:12px 0 4px;font-size:15px;color:var(--muted)}
.sel{outline:3px solid var(--blue);outline-offset:1px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
.toast.show{opacity:1}
.center{text-align:center;padding:40px 10px}
</style>
</head>
<body>
<main id="app" data-k=""><div class="center muted">…</div></main>
<div class="toast" id="toast"></div>
<script>
// Two ways to run: inside Apps Script (google.script.run, key from the template) or as a static page (fetch, key from #k=).
const EXEC_URL = 'https://script.google.com/macros/s/AKfycbxjzT6OUMaH1CIajHS09t53rN7A-XYc0cX6fTv9KSZoMMOWy6pg1vhPuUpHuxTMV8Sh/exec';
const INSIDE = typeof google !== 'undefined' && google.script && google.script.run;
const KEY = (INSIDE ? document.getElementById('app').dataset.k : (location.hash.match(/k=([A-Za-z0-9]+)/) || [])[1] || '').replace(/[^A-Za-z0-9]/g, '').slice(0, 64);
const L = {
 RU:{title:'Звонки шадханам',hello:'Здравствуйте, {name}!',mine:'Мои звонки',all:'Список',search:'Поиск: имя, город…',call:'Позвонить',wa:'WhatsApp',
   script:'Что сказать',profile:'Скопировать данные Элияху',copied:'Скопировано',busy:'{name} уже звонит',tip:'Заметка',giveBack:'Вернуть в список',
   save:'Сохранить',saved:'Сохранено, спасибо!',notes:'Что узнали (можно голосом — значок микрофона на клавиатуре)',names:'Имена и телефоны других шадханов, если дали',
   nextQ:'Что дальше?',next_profile:'Отправить данные Элияху',next_call:'Пусть Элияху позвонит',next_:'Ничего',
   res_spoke:'Поговорили',res_noanswer:'Не ответили',res_callback:'Перезвонить позже',res_wrong:'Неверный номер',res_inactive:'Больше не занимается',res_stop:'Просили не звонить',
   pick:'Выберите результат',hours:'Часы',empty:'Сейчас некого звонить. Спасибо!',emptyMine:'Нажмите «Позвонить» в списке — человек появится здесь.',
   more:'Показать ещё',link:'Ссылка не работает. Попросите новую у Элияху.',err:'Что-то пошло не так: ',taken:'{name} уже взял(а) этого человека',orig:'Оригинал',trans:'Русский'},
 HE:{title:'שיחות לשדכנים',hello:'שלום {name}!',mine:'השיחות שלי',all:'רשימה',search:'חיפוש: שם, עיר…',call:'להתקשר',wa:'וואטסאפ',
   script:'מה לומר',profile:'להעתיק את הפרטים של אליהו',copied:'הועתק',busy:'{name} כבר מתקשר/ת',tip:'הערה',giveBack:'להחזיר לרשימה',
   save:'שמירה',saved:'נשמר, תודה!',notes:'מה נאמר (אפשר בקול – המיקרופון במקלדת)',names:'שמות וטלפונים של שדכנים נוספים, אם נתנו',
   nextQ:'מה הלאה?',next_profile:'לשלוח את הפרטים של אליהו',next_call:'שאליהו יתקשר',next_:'כלום',
   res_spoke:'דיברנו',res_noanswer:'לא ענו',res_callback:'להתקשר שוב אחר כך',res_wrong:'מספר שגוי',res_inactive:'כבר לא פעיל/ה',res_stop:'ביקשו לא להתקשר',
   pick:'בחר/י תוצאה',hours:'שעות',empty:'אין כרגע למי להתקשר. תודה!',emptyMine:'לחצו "להתקשר" ברשימה – האדם יופיע כאן.',
   more:'עוד',link:'הקישור לא פעיל. בקשו קישור חדש מאליהו.',err:'משהו השתבש: ',taken:'{name} כבר לקח/ה את האדם הזה'},
 EN:{title:'Shadchan calls',hello:'Hello {name}!',mine:'My calls',all:'List',search:'Search: name, city…',call:'Call',wa:'WhatsApp',
   script:'What to say',profile:'Copy Eliyahu\'s details',copied:'Copied',busy:'{name} is calling',tip:'Note',giveBack:'Give back to the list',
   save:'Save',saved:'Saved, thank you!',notes:'What you heard (you can speak it: microphone on the keyboard)',names:'Names and numbers of other shadchanim, if they gave any',
   nextQ:'What next?',next_profile:'Send Eliyahu\'s details',next_call:'Eliyahu should call',next_:'Nothing',
   res_spoke:'We spoke',res_noanswer:'No answer',res_callback:'Call back later',res_wrong:'Wrong number',res_inactive:'Not active anymore',res_stop:'Asked not to call',
   pick:'Pick a result',hours:'Hours',empty:'Nobody to call right now. Thank you!',emptyMine:'Tap "Call" in the list and the person appears here.',
   more:'Show more',link:'This link is not active. Ask Eliyahu for a new one.',err:'Something went wrong: ',taken:'{name} already took this person',orig:'Original',trans:'English'}
};
let showTr = true; try { showTr = localStorage.getItem('h_tr') !== '0'; } catch(e){}
let D = null, tab = 'all', q = '', shown = 40, lang = 'HE';
const form = {};   // id → {result, next}
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const run = (fn, ...a) => INSIDE
  ? new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](KEY, ...a))
  : fetch(EXEC_URL, { method: 'POST', credentials: 'omit', redirect: 'follow', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ fn: fn, k: KEY, args: a }) })
      .then(r => r.json()).then(j => { if (!j.ok) throw new Error(j.error || 'error'); return j.data; });
function t(key, map){ let s = (D && D.texts[key + '_' + lang]) || (L[lang] || L.HE)[key] || L.EN[key] || key;
  Object.keys(map||{}).forEach(k => s = s.split('{'+k+'}').join(map[k])); return s; }
function toast(m){ const x=$('#toast'); x.textContent=m; x.classList.add('show'); clearTimeout(x._h); x._h=setTimeout(()=>x.classList.remove('show'),2600); }
function fail(e){ const m = String(e && e.message || e); if (/LINK/.test(m)) return showLink(); toast(t('err') + m); }
function showLink(){ $('#app').innerHTML = `<div class="center">${esc(t('link'))}</div>`; }

async function load(){
  try { D = await run('h_load'); lang = D.me.lang; document.documentElement.dir = lang === 'HE' ? 'rtl' : 'ltr'; document.documentElement.lang = lang.toLowerCase(); render(); }
  catch(e){ fail(e); }
}
function busyTyping(){ return Object.values(form).some(f => f.result || f.notes || f.names) || (document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName) && document.activeElement.id !== 'q'); }
setInterval(() => { if (document.visibilityState === 'visible' && D && !busyTyping()) load(); }, 60000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && D && !busyTyping()) load(); });

function render(){
  const mine = D.items.filter(x => x.mine);
  const ql = q.toLowerCase();
  const list = D.items.filter(x => !x.mine && (!ql || (x.name + ' ' + x.city + ' ' + x.spec + ' ' + (x.tr ? x.tr.name + ' ' + x.tr.city + ' ' + x.tr.spec : '')).toLowerCase().indexOf(ql) >= 0))
    .sort((a, b) => (a.by ? 1 : 0) - (b.by ? 1 : 0));
  const hasTr = D.items.some(x => x.tr);
  let h = (hasTr ? `<div class="tabs"><button class="${!showTr?'on':''}" onclick="setTr(false)">${esc(t('orig'))}</button><button class="${showTr?'on':''}" onclick="setTr(true)">${esc(t('trans'))}</button></div>` : '') +
    `<h1>${esc(t('title'))}</h1><div class="muted">${esc(t('hello', {name: D.me.name}))}</div>
    <div class="row"><button onclick="toggle('scr')">${esc(t('script'))}</button>${D.profile ? `<button onclick="copyProfile()">${esc(t('profile'))}</button>` : ''}</div>
    <div class="script" id="scr" dir="auto">${esc(scriptText())}</div>
    <div class="tabs"><button class="${tab==='mine'?'on':''}" onclick="setTab('mine')">${esc(t('mine'))} (${mine.length})</button>
      <button class="${tab==='all'?'on':''}" onclick="setTab('all')">${esc(t('all'))} (${list.length})</button></div>`;
  if (tab === 'mine') h += mine.length ? mine.map(cardHtml).join('') : `<div class="center muted">${esc(t('emptyMine'))}</div>`;
  else {
    h += `<input id="q" dir="auto" placeholder="${esc(t('search'))}" value="${esc(q)}" oninput="q=this.value;shown=40;renderKeep()">`;
    h += list.length ? list.slice(0, shown).map(cardHtml).join('') : `<div class="center muted">${esc(t('empty'))}</div>`;
    if (list.length > shown) h += `<div class="row"><button onclick="shown+=40;render()">${esc(t('more'))}</button></div>`;
  }
  $('#app').innerHTML = h;
}
function renderKeep(){ const p = $('#q') && $('#q').selectionStart; render(); const i = $('#q'); if (i){ i.focus(); try{ i.setSelectionRange(p,p); }catch(e){} } }
function setTr(v){ showTr = v; try { localStorage.setItem('h_tr', v ? '1' : '0'); } catch(e){} render(); }
function setTab(x){ tab = x; render(); window.scrollTo(0,0); }
// the call script is in the Texts tab of the helpers' sheet (SCRIPT_RU / SCRIPT_HE / SCRIPT_EN)
function scriptText(){ return (D.texts['SCRIPT_' + lang] || D.texts.SCRIPT_HE || '').split('{helper}').join(D.me.name); }
function toggle(id){ $('#'+id).classList.toggle('open'); }

function cardHtml(x){
  if (showTr && x.tr) x = Object.assign({}, x, { name: x.tr.name ? x.tr.name + ' (' + x.name + ')' : x.name, city: x.tr.city || x.city, spec: x.tr.spec || x.spec, why: x.tr.why || x.why });
  const meta = [x.city, x.langs].filter(Boolean).map(esc).join(' • ');
  let h = `<div class="card ${x.by?'busy':''}" id="c-${x.id}">
    <p class="name" dir="auto">${esc(x.name)}</p>${meta?`<div class="muted" dir="auto">${meta}</div>`:''}
    ${x.hours?`<div class="muted" dir="auto">${esc(t('hours'))}: ${esc(x.hours)}</div>`:''}
    ${x.spec?`<div dir="auto" style="margin-top:4px">${esc(x.spec)}</div>`:''}
    ${x.why?`<div class="chips">${x.why.split(' · ').map(w=>`<span class="chip" dir="auto">${esc(w)}</span>`).join('')}</div>`:''}
    ${x.tip?`<div class="tag" dir="auto">${esc(t('tip'))} – ${esc(x.tip)}</div>`:''}`;
  if (x.by) return h + `<div class="tag">${esc(t('busy', {name: x.by}))}</div></div>`;
  h += `<div class="row">${x.phones.map(p => `<a class="btn primary" href="tel:${esc(p.tel)}" onclick="hold('${x.id}')">${esc(t('call'))} ${esc(p.local)}</a>`).join('')}
    ${x.phones.filter(p=>p.mobile).slice(0,1).map(p => `<a class="btn" href="https://wa.me/${esc(p.tel.replace('+',''))}" target="_blank" onclick="hold('${x.id}')">${esc(t('wa'))}</a>`).join('')}</div>`;
  if (x.mine) {
    const f = form[x.id] || {};
    h += `<label>${esc(t('pick'))}</label><div class="row">${['spoke','noanswer','callback','wrong','inactive','stop'].map(r =>
      `<button class="${f.result===r?'sel on':''}" onclick="pickRes('${x.id}','${r}')">${esc(t('res_'+r))}</button>`).join('')}</div>`;
    if (f.result === 'spoke') h += `<label>${esc(t('nextQ'))}</label><div class="row">${['profile','call',''].map(n =>
      `<button class="${(f.next||'')===n?'sel on':''}" onclick="pickNext('${x.id}','${n}')">${esc(t('next_'+n))}</button>`).join('')}</div>`;
    h += `<label for="n-${x.id}">${esc(t('notes'))}</label><textarea id="n-${x.id}" dir="auto" oninput="keep('${x.id}')">${esc(f.notes||'')}</textarea>
      <label for="m-${x.id}">${esc(t('names'))}</label><textarea id="m-${x.id}" dir="auto" oninput="keep('${x.id}')">${esc(f.names||'')}</textarea>
      <div class="row"><button class="good" onclick="save('${x.id}')" ${f.result?'':'disabled'}>${esc(t('save'))}</button></div>
      <div class="row"><button class="quiet" onclick="giveBack('${x.id}')">${esc(t('giveBack'))}</button></div>`;
  }
  return h + `</div>`;
}

function keep(id){ const f = form[id] = form[id] || {}; f.notes = $('#n-'+id).value; f.names = $('#m-'+id).value; }
function pickRes(id, r){ keep(id); form[id].result = r; if (r !== 'spoke') form[id].next = ''; render(); }
function pickNext(id, n){ keep(id); form[id].next = n; render(); }

function hold(id){
  const x = D.items.find(i => i.id === id); if (!x || x.mine) return;
  x.mine = true; form[id] = form[id] || {};
  run('h_reserve', id).then(r => { if (!r.ok){ x.mine = false; x.by = r.by; delete form[id]; toast(t('taken', {name: r.by})); render(); } }).catch(fail);
  setTimeout(() => { tab = 'mine'; render(); }, 400);
}
async function giveBack(id){
  try { await run('h_release', id); delete form[id]; const x = D.items.find(i => i.id === id); if (x) x.mine = false; render(); }
  catch(e){ fail(e); }
}
async function save(id){
  keep(id); const f = form[id]; if (!f || !f.result) return toast(t('pick'));
  const b = document.querySelector('#c-'+id+' .good'); if (b) b.disabled = true;
  try { await run('h_save', id, f.result, f.next || '', f.notes || '', f.names || '');
    delete form[id]; D.items = D.items.filter(i => i.id !== id); toast(t('saved')); render(); }
  catch(e){ if (b) b.disabled = false; fail(e); }
}
function copyProfile(){
  const done = () => toast(t('copied'));
  if (navigator.clipboard) navigator.clipboard.writeText(D.profile).then(done, () => fallback());
  else fallback();
  function fallback(){ const a = document.createElement('textarea'); a.value = D.profile; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove(); done(); }
}
load();
</script>
</body>
</html>
