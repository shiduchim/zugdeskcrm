<!DOCTYPE html>
<html>
<head>
<base target="_top">
<script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;var l=localStorage.getItem("look");}catch(e){}document.documentElement.dataset.look=(l==="classic"?"classic":"zd");</script>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Rubik:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EEF3; --surface:#FFFFFF; --ink:#1B2733; --muted:#5B6B7B; --line:#D3DCE5;
  --blue:#2B67A8; --blue-ink:#FFFFFF; --blue-soft:#DCE8F5; --green:#2F7A4F; --green-soft:#DDF0E4;
  --amber:#9A6A12; --amber-soft:#F6EBD3; --red:#A23B32; --red-soft:#F5DEDB;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#121A22; --surface:#1B2631; --ink:#E6EDF3; --muted:#9AAABA; --line:#2C3A48;
  --blue:#5B9BE0; --blue-ink:#0E1620; --blue-soft:#1E3247; --green:#6BC28F; --green-soft:#1C3328;
  --amber:#E0B35E; --amber-soft:#3A2F1A; --red:#E58A80; --red-soft:#3D2522; color-scheme:dark;
}}
:root[data-theme=dark]{
  --bg:#121A22; --surface:#1B2631; --ink:#E6EDF3; --muted:#9AAABA; --line:#2C3A48;
  --blue:#5B9BE0; --blue-ink:#0E1620; --blue-soft:#1E3247; --green:#6BC28F; --green-soft:#1C3328;
  --amber:#E0B35E; --amber-soft:#3A2F1A; --red:#E58A80; --red-soft:#3D2522; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Rubik,"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.45}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px max(16px,calc((100% - 720px)/2 + 12px)) 8px;display:flex;align-items:baseline;justify-content:space-between}
header h1{margin:0;font-size:20px;font-weight:600;letter-spacing:.2px}
header .date{color:var(--muted);font-size:13px;white-space:nowrap}
header .hr{display:flex;align-items:center;gap:10px}
header .gear{min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.seg{display:flex;gap:6px}.seg button{flex:1}.seg button.on{background:var(--blue);color:var(--blue-ink);border-color:var(--blue)}
.tabs{display:flex;gap:6px;margin:12px 0 4px;border-bottom:1px solid var(--line)}
.tabs button{flex:1;min-height:44px;border:0;background:none;color:var(--muted);font:inherit;font-size:15px;cursor:pointer;border-bottom:3px solid transparent}
.tabs button.on{color:var(--blue);font-weight:600;border-bottom-color:var(--blue)}
.sheet[data-tab=basic] .t-details,.sheet[data-tab=details] .t-basic{display:none}
.morehist{margin-top:4px}
main{max-width:720px;margin:0 auto;padding:0 12px 96px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:0 max(0px,calc((100% - 720px)/2)) env(safe-area-inset-bottom)}
nav button{flex:1;min-height:56px;border:0;background:none;color:var(--muted);font:inherit;font-size:14px;cursor:pointer}
nav button.on{color:var(--blue);font-weight:600;box-shadow:inset 0 3px 0 var(--blue)}
h2{font-size:15px;font-weight:600;color:var(--muted);margin:22px 4px 8px}
.progress{margin:4px 4px 10px;color:var(--muted);font-size:14px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--green);transition:width .3s}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.card.done{opacity:.55}
.card.call{border:2px solid var(--blue);padding:18px}
.name{font-size:19px;font-weight:600;cursor:pointer;margin:0}
.call .name{font-size:24px}
.meta{color:var(--muted);font-size:14px;margin-top:2px}
.spec{font-size:14px;margin-top:6px}
.notebox{display:flex;gap:8px;margin-top:12px;align-items:center}
.notebox input{flex:1;min-width:0;margin:0}
.notebox .btn{flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:12.5px;padding:3px 9px;border-radius:999px;background:var(--blue-soft);color:var(--ink)}
.chip.warn{background:var(--amber-soft)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--blue-ink);font-weight:500}
.btn.good{background:var(--green-soft);border-color:transparent;color:var(--green);font-weight:500}
.btn.quiet{border-color:transparent;background:none;color:var(--muted)}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.5;cursor:default}
.btn.big{min-height:56px;font-size:18px;flex:1}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.more{display:none}.more.open{display:flex}
.empty{color:var(--muted);padding:14px 6px;font-size:15px}
.script{background:var(--blue-soft);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:15px;display:none}
.script.open{display:block}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;min-height:44px;padding:8px 12px;width:100%}
textarea{min-height:80px}
.filters{display:flex;gap:6px;overflow-x:auto;padding:8px 2px}
.filters button{flex:none;min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.filters button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.list .card{padding:12px}
.crow{display:block;width:100%;text-align:start;background:var(--surface);border:0;border-bottom:1px solid var(--line);padding:10px 14px;min-height:56px;font:inherit;color:var(--ink);cursor:pointer}
.crow:first-child{border-radius:12px 12px 0 0}.crow:last-child{border-radius:0 0 12px 12px;border-bottom:0}
.crow:only-child{border-radius:12px}
.crow:hover{background:var(--blue-soft)}
.crow .nm{display:block;font-weight:600;font-size:16px}
.crow .sub{display:block;color:var(--muted);font-size:13.5px;margin-top:1px}
.crow .tg{display:flex;gap:6px;margin-top:5px}
.crow .tg i{font-style:normal;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--blue-soft)}
#clist{border:1px solid var(--line);border-radius:12px;overflow:hidden}
#clist:has(.empty){border:0}
.ctools{display:flex;gap:8px;margin-top:2px}
.fbar{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}
.fbar > *{flex:1 1 auto;width:auto;min-height:44px;margin:0}
.fbar select{flex:1 1 140px;min-width:0}
.fbar button{padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:15px;cursor:pointer}
.fbar button.on{background:var(--blue);color:var(--blue-ink);border-color:var(--blue)}
.fbar > *{flex:1 1 40%}
.fbar > button{white-space:nowrap}
.fchips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}
.fchips button{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.fchips button.quiet{border-color:transparent;background:transparent;color:var(--muted)}
.fchips .fline{flex:1;justify-content:flex-start;text-align:start;border:0;background:transparent;border-radius:0;padding:4px 2px;font-size:15px;line-height:1.35}
.fline .t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fline u{color:var(--blue);text-underline-offset:3px;white-space:nowrap}
.fchips{align-items:center;flex-wrap:nowrap}
.fchips .quiet{flex:none}
#fshade{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40}
#fsheet{position:fixed;z-index:41;inset-inline:0;bottom:0;max-height:85dvh;display:flex;flex-direction:column;background:var(--surface);color:var(--ink);border-radius:18px 18px 0 0;box-shadow:0 -6px 30px rgba(0,0,0,.2)}
@media (min-width:900px){#fsheet{inset-inline-start:auto;inset-inline-end:0;top:0;bottom:0;max-height:none;width:400px;border-radius:0}}
.fs-head,.fs-foot{display:flex;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.fs-head b{flex:1;font-size:18px}
.fs-foot{border-bottom:0;border-top:1px solid var(--line);padding-bottom:calc(12px + env(safe-area-inset-bottom))}
.fs-foot .primary{flex:1}
.fs-body{overflow:auto;padding:4px 16px 12px;overscroll-behavior:contain}
.fs-body h4{margin:16px 0 4px;font-size:15px}
.fopt{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 4px;cursor:pointer}
.fopt input{width:22px;height:22px;min-height:0;flex:none;margin:0;padding:0}
.fopt span{flex:1;unicode-bidi:isolate}
.fopt small{color:var(--muted)}
.fopt.zero{opacity:.45}
body.flock{overflow:hidden}
.ctools select{flex:1;min-width:0}
.fdrop{position:relative;margin:8px 0 4px}
.fdrop summary{list-style:none;display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);cursor:pointer;font-size:15px}
.fdrop summary::-webkit-details-marker{display:none}
.fdrop summary::after{content:"▾";margin-inline-start:8px;opacity:.6}
.fdrop summary b{font-weight:500;margin-inline-start:6px;opacity:.7}
.fpanel{position:absolute;z-index:20;inset-inline-start:0;top:calc(100% + 4px);min-width:240px;padding:8px;border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:0 6px 24px rgba(0,0,0,.15);display:grid;gap:2px}
.fpanel label{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 8px;border-radius:8px;cursor:pointer}
.fpanel input{width:20px;height:20px}
.fpanel button{min-height:44px;margin-top:4px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2,var(--surface));color:var(--ink);font:inherit;cursor:pointer}
.filters button b{font-weight:500;opacity:.65;margin-inline-start:6px}
.status{font-size:12.5px;color:var(--muted)}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.subj{font-weight:600;margin:4px 0 8px}
.mailbox{background:#fff;color:#111;border:1px solid var(--line);border-radius:10px;padding:14px;overflow-wrap:anywhere}
.mailbox a{color:#1a0dab;pointer-events:none}
.wabox{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55}
.flab{display:block;font-weight:600;margin:14px 2px 6px}
.fhelp{color:var(--muted);font-size:13px;margin:4px 2px 0}
.sheet textarea{font-size:16px;line-height:1.5}
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;display:none}
.sheet.open{display:block}
.sheet .inner{max-width:720px;margin:0 auto;padding:12px 14px 60px}
.sheet .top{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--bg);padding:6px 0}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
.hist{font-size:14px;border-top:1px solid var(--line);padding:8px 0}
.hist b{font-weight:500}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;max-width:90vw}
.toast.show{opacity:1}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stat div{background:var(--bg);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px;font-weight:600}
.stat span{font-size:12.5px;color:var(--muted)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px}
.loading{color:var(--muted);padding:20px 6px}
[dir=auto]{unicode-bidi:plaintext}
/* PC: list on the left, the open card stays on the right */
@media (min-width:900px){
  :root{--lw:clamp(380px,42vw,560px)}
  header{width:var(--lw);padding:14px 16px 8px}
  main{max-width:none;width:var(--lw);margin:0;padding:0 16px 96px}
  .sheet{display:block;left:var(--lw);top:0;bottom:57px;right:0;z-index:4;border-inline-start:1px solid var(--line);background:var(--surface)}
  .sheet .top{background:var(--surface)}
  .sheet .inner{padding:12px 24px 40px}
  .sheet:not(.open) .inner{display:none}
  .sheet:not(.open)::before{content:"Click a name to see the card here.";display:block;color:var(--muted);padding:48px 24px;text-align:center}
  .crow.sel{background:var(--blue-soft);box-shadow:inset 3px 0 0 var(--blue)}
  .toast{left:calc(var(--lw)/2)}
}
/* ZugDesk look (default): warm paper, black buttons, Inter; Classic is in Settings */
:root[data-look=zd]{--bg:#FAF8F3; --surface:#FFFFFF; --ink:#1F1F1E; --muted:#66655F; --line:#E4E1D9; --blue:#1F1F1E; --blue-ink:#FFFFFF; --blue-soft:#EFEBE1; --green:#2E6B3A; --green-soft:#EAF3EC; --amber:#8A5A00; --amber-soft:#FBF2DE; --red:#B3261E; --red-soft:#FBEDEB; --link:#2F56B0; --surface-2:#F3F1EA; --shadow:0 1px 2px rgba(31,31,30,.06),0 1px 1px rgba(31,31,30,.04); color-scheme:light;}
@media (prefers-color-scheme:dark){:root[data-look=zd]:not([data-theme=light]){--bg:#1C1B1A; --surface:#262523; --ink:#ECEAE4; --muted:#A6A398; --line:#3D3B37; --blue:#ECEAE4; --blue-ink:#1C1B1A; --blue-soft:#36332E; --green:#7CC48C; --green-soft:#1F3324; --amber:#E3B55C; --amber-soft:#3A2F1A; --red:#F08A80; --red-soft:#3A2422; --link:#8DB0F2; --surface-2:#302E2B; --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark;}}
:root[data-look=zd][data-theme=dark]{--bg:#1C1B1A; --surface:#262523; --ink:#ECEAE4; --muted:#A6A398; --line:#3D3B37; --blue:#ECEAE4; --blue-ink:#1C1B1A; --blue-soft:#36332E; --green:#7CC48C; --green-soft:#1F3324; --amber:#E3B55C; --amber-soft:#3A2F1A; --red:#F08A80; --red-soft:#3A2422; --link:#8DB0F2; --surface-2:#302E2B; --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark;}
[data-look=zd] body{font-family:Inter,Rubik,"Segoe UI",Arial,sans-serif}
[data-look=zd] header h1{font-size:18px;letter-spacing:-.01em}
[data-look=zd] h2{font-family:"JetBrains Mono",Consolas,monospace;font-weight:400;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;margin:24px 4px 8px}
[data-look=zd] .card{border-radius:12px;box-shadow:var(--shadow)}
[data-look=zd] .card.call{border:1px solid var(--ink);box-shadow:var(--shadow),inset 4px 0 0 var(--ink)}
[data-look=zd] .btn{border-radius:8px;font-size:15px}
[data-look=zd] .btn.primary:hover{opacity:.88}
[data-look=zd] .btn.good{background:var(--green-soft);color:var(--green)}
[data-look=zd] .chip{background:var(--surface-2);border:1px solid var(--line);font-size:12.5px}
[data-look=zd] .chip.warn{background:var(--amber-soft);border-color:transparent;color:var(--amber)}
[data-look=zd] .status{font-family:"JetBrains Mono",Consolas,monospace;font-size:11.5px;letter-spacing:.04em}
[data-look=zd] #clist{background:var(--surface);box-shadow:var(--shadow)}
[data-look=zd] .crow{border-inline-start:3px solid transparent;background:var(--surface)}
[data-look=zd] .crow:hover{background:var(--surface-2)}
[data-look=zd] .crow.sel{background:var(--blue-soft);box-shadow:none;border-inline-start-color:var(--ink)}
[data-look=zd] .crow .tg i{background:var(--surface-2);border:1px solid var(--line)}
[data-look=zd] nav button.on{color:var(--ink);box-shadow:inset 0 3px 0 var(--ink)}
[data-look=zd] .tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
[data-look=zd] .sheet .inner .name{letter-spacing:-.01em}
[data-look=zd] a{color:var(--link)}
[data-look=zd] a.btn{color:var(--ink)}
[data-look=zd] a.btn.primary{color:var(--blue-ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><h1>zugdeskcrm</h1><span class="hr"><span class="date" id="date"></span><button class="gear" onclick="openSettings()">Settings</button></span></header>
<main>
  <section id="v-today"><div class="loading">Loading today…</div></section>
  <section id="v-contacts" hidden>
    <input id="q" placeholder="Search anyone: name, city, phone, email…" autocomplete="off" dir="auto" aria-label="Search">
    <div class="ctools">
      <select id="cshow" aria-label="Show">
        <option value="ready">Ready to contact</option><option value="talking">Talking</option><option value="contacted">Contacted</option>
        <option value="later">Later</option><option value="closed">Closed</option><option value="all">Everyone</option>
      </select>
    </div>
    <div id="fwrap"><div class="fbar" id="fbar"></div><div class="fchips" id="fchips"></div></div>
    <div class="status" id="ccount" style="margin:2px 4px 8px"></div>
    <div class="list" id="clist"></div>
    <div id="cmore" class="loading" hidden>Loading more…</div>
  </section>
  <section id="v-received" hidden></section>
  <section id="v-email" hidden></section>
</main>
<nav>
  <button data-v="today" class="on">Today</button>
  <button data-v="contacts">Contacts</button>
  <button data-v="received">Received</button>
  <button data-v="email">Email</button>
</nav>
<div class="sheet" id="sheet"><div class="inner" id="sheetInner"></div></div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const run = (fn, ...a) => new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...a));
let T = null;              // today data
let profiles = {}, references = {};
let callScript = '';

function todayStr(){ return new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Jerusalem'}); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2600); }
function fail(e){ toast('Something went wrong: ' + (e && e.message || e)); console.error(e); }

/* ---------- settings (stored on this device) ---------- */
function getTheme(){ try{ return localStorage.getItem('theme')||'auto'; }catch(e){ return 'auto'; } }
function setTheme(t){
  try{ localStorage.setItem('theme', t); }catch(e){}
  if (t==='auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t;
  openSettings();
}
function setLook(l){ try{ localStorage.setItem('look', l); }catch(e){} document.documentElement.dataset.look = l; openSettings(); }
function openSettings(){
  sheetId = null; histReq++;
  const lk = document.documentElement.dataset.look, lb = (v,l) => `<button class="btn ${lk===v?'on':''}" onclick="setLook('${v}')">${l}</button>`;
  const t = getTheme(), b = (v,l) => `<button class="btn ${t===v?'on':''}" onclick="setTheme('${v}')">${l}</button>`;
  $('#sheetInner').innerHTML = `
    <div class="top"><button class="btn" onclick="closeSheet()">Back</button><span class="status">Settings</span></div>
    <h2>Messages</h2>
    <div class="card"><div class="meta">See exactly what shadchanim receive (email, follow-up, WhatsApp) in Hebrew, Russian and English, and change the words.</div>
      <div class="row"><button class="btn primary" onclick="openMessages()">Messages and profile</button><button class="btn" onclick="openAppSettings()">App settings</button></div></div>
    <h2>Theme</h2>
    <div class="card"><div class="seg">${b('auto','Auto')}${b('light','Light')}${b('dark','Dark')}</div>
      <div class="meta" style="margin-top:8px">Auto follows your phone or computer. Saved on this device.</div></div>
    <h2>Look</h2>
    <div class="card"><div class="seg">${lb('zd','ZugDesk')}${lb('classic','Classic')}</div></div>
    <h2>Contacts</h2>
    <div class="card"><div class="meta">Add many people at once from a file or a copied table. Nobody is added twice.</div>
      <div class="row"><button class="btn primary" onclick="openImport()">Import contacts</button></div></div>
    <h2>Separate lists</h2>
    <div class="card"><div class="meta">Kept apart from your shadchanim: never in Contacts, search, counts or Today, and never contacted automatically.</div>
      <div class="row"><button class="btn" onclick="openSeparate('Organization')">Organizations</button><button class="btn" onclick="openSeparate('Other')">Never answered</button></div></div>
    <h2>Helpers</h2>

function readImportFile(inp){
  const f = inp.files && inp.files[0]; if (!f) return;
  const r = new FileReader(); r.onload = () => { $('#i-text').value = String(r.result).replace(/^﻿/,''); toast('File loaded — '+f.name); }; r.readAsText(f, 'utf-8');
}
function splitTable(text){
  const lines = text.replace(/\r\n?/g,'\n').split('\n').filter(l=>l.trim());
  if (!lines.length) return [];
  const f = lines.join('\n'), cnt = c => f.split(c).length - 1;
  const d = cnt('\t') ? '\t' : (cnt(';') > cnt(',') ? ';' : ',');
  return lines.map(l => { const out=[]; let cur='', q=false;
    for (let i=0;i<l.length;i++){ const ch=l[i];
      if (q){ if (ch==='"' && l[i+1]==='"'){ cur+='"'; i++; } else if (ch==='"') q=false; else cur+=ch; }
      else if (ch==='"' && !cur.trim()) q=true; else if (ch===d){ out.push(cur.trim()); cur=''; } else cur+=ch; }
    out.push(cur.trim()); return out; });
}
const IMP_COLS = [['email',/e-?mail|mail|אימייל|מייל|דוא"?ל|почта/i],['phone',/phone|mobile|cell|tel|טלפון|נייד|פלאפון|телефон/i],
  ['city',/city|town|location|עיר|ישוב|יישוב|город/i],['notes',/note|comment|about|detail|remark|הער|заметк|коммент/i],
  ['specialty',/specialt|sector|focus|מגזר|התמחות|קהל/i],['languages',/lang|שפ|язык/i],['name',/name|שם|имя|фио|фамил/i]];
function parseImport(text){
  const t = splitTable(text); if (!t.length) return [];
  const isData = c => /@/.test(c) || c.replace(/\D/g,'').length >= 9;
  const map = t[0].map(h => { const m = IMP_COLS.find(([,re])=>re.test(h)); return m ? m[0] : null; });
  const hasHead = map.some(Boolean) && !t[0].some(isData);
  const body = hasHead ? t.slice(1) : t;
  return body.map(cells => {
    // one loose line, e.g. "Sarah Levi 054-1234567 sarah@x.com": pull out email and phones, the rest is the name
    if (!hasHead && cells.length === 1){
      let v = cells[0]; const em = (v.match(/[^\s@,;<>()]+@[^\s@,;<>()]+\.[^\s@,;<>()]+/)||[''])[0];
      v = v.replace(em,' '); const ph = v.match(/\+?\d[\d\s().-]{7,}\d/g) || [];
      ph.forEach(x => v = v.replace(x,' '));
      cells = [v.replace(/[<>()|;,:]+/g,' ').replace(/\s+[–-]+(?=\s|$)|^\s*[–-]+/g,' ').replace(/\s+/g,' ').trim(), em].concat(ph).filter(Boolean);
    }
    const r = {name:'',phone:'',phone2:'',email:'',city:'',notes:'',specialty:'',languages:''}, extra = [];
    cells.forEach((v, j) => { if (!v) return;
      let k = hasHead ? map[j] : null;
      if (!k) k = /@/.test(v) && !r.email ? 'email' : (v.replace(/\D/g,'').length >= 9 && v.replace(/[\d\s()+.-]/g,'').length < 3 ? 'phone' : (!hasHead && !r.name ? 'name' : null));
      if (k==='phone' && r.phone) k = 'phone2';
      if (k==='email' && !/@/.test(v)) k = null;
      if (!k) return extra.push(v);
      if (k==='name' && r.name) r.name += ' ' + v; else if (k==='phone2' && r.phone2) extra.push(v); else r[k] = v;
    });
    if (extra.length) r.notes = [r.notes].concat(extra).filter(Boolean).join(' · ');
    return r;
  }).filter(r => Object.values(r).some(Boolean));
}
async function checkImport(commit){

    if (!rows.length) return toast('Choose a file or paste the list first');

  const out = $('#i-out'); out.innerHTML = '<div class="loading">'+(commit?'Adding…':'Checking against your contacts…')+'</div>';

    const r = await run('api_import', IMP.rows, IMP.src, IMP.type, !!commit);
    const li = a => a.length ? `<div class="meta" dir="auto">${a.map(esc).join(' · ')}${a.length===8?' …':''}</div>` : '';
    if (r.done){

      <div class="spec"><b>${r.known}</b> already in your list (same phone or email) — not added again${li(r.sampleKnown)}</div>
      ${r.blocked?`<div class="spec"><b>${r.blocked}</b> on Do not contact — skipped</div>`:''}

    out.scrollIntoView({block:'start', behavior:'smooth'});

function renderToday(){
  const typed = {}; document.querySelectorAll('#v-today .notebox input').forEach(i=>{ if(i.value) typed[i.id]=i.value; });
  const y = window.scrollY;
  [T.call,T.wa,T.replies,T.checkins,T.asks].forEach(l=>l.forEach(remember));
  const items = [...T.call, ...T.wa];
  const done = items.filter(c=>c.doneToday).length;
  const pct = items.length ? Math.round(done/items.length*100) : 0;
  let h = `<div class="progress">${done} of ${items.length} done today<div class="bar"><i style="width:${pct}%"></i></div></div>`;

  h += `<h2>Your call today</h2>`;
  h += T.call.length ? T.call.map(callCard).join('') : `<div class="empty">No call today — everyone with a phone number has been reached.</div>`;

  const fromHelpers = T.replies.filter(c=>/^Helper/.test(c.lastChannel||'')), wrote = T.replies.filter(c=>!/^Helper/.test(c.lastChannel||''));
  if (fromHelpers.length){
    h += `<h2>From your helpers — your turn</h2>` + fromHelpers.map(c=>card(c,'reply')).join('');
  }
  if (wrote.length){
    h += `<h2>Wrote back to you</h2>` + wrote.map(c=>card(c,'reply')).join('');
  }
  if ((T.aside||[]).length){
    h += `<h2>Helpers set these aside — you decide</h2>` + T.aside.map(c => `<div class="card" id="as-${c.id}"><div class="name" dir="auto">${esc(c.name)}</div>`
      + `<div class="sub" dir="auto">${esc([c.city, c.specialty].filter(Boolean).join(' • '))}</div><div class="sub" dir="auto">${esc(c.asideBy)}: ${esc(c.asideWhy || 'Not for us')}</div>`
      + `<div class="actions"><button class="btn" onclick="asideAgree('${c.id}')">Agree, set aside</button><button class="btn quiet" onclick="asideKeep('${c.id}')">Keep</button></div></div>`).join('');
  }
  if (T.suggestions.length){
    h += `<h2>Recommended to you — add with one tap</h2>` + T.suggestions.map(sugCard).join('');
  }
  h += `<h2>Messages to send</h2>`;
  h += T.wa.length ? T.wa.map(c=>card(c,'wa')).join('') : `<div class="empty">No messages for today.</div>`;

  if (T.checkins.length){
    h += `<h2>Check in again</h2>` + T.checkins.map(c=>card(c,'checkin')).join('');
  }
  if (T.asks.length){
    h += `<h2>Good time to ask for more shadchanim</h2>
      <p class="meta" style="margin:-4px 4px 8px">You had a good contact with these people recently. A short, polite question is ready.</p>` + T.asks.map(askCard).join('');
  }
  h += `<div class="row" style="margin-top:20px"><button class="btn quiet" onclick="rebuild()">Pick new people for today</button></div>`;
  $('#v-today').innerHTML = h;
  Object.keys(typed).forEach(k=>{ const i=document.getElementById(k); if(i) i.value=typed[k]; });
  if (!$('#v-today').hidden) window.scrollTo(0, y);
}

async function acceptSug(row){
  try{ const r=await run('api_acceptSuggestion', row, $('#sn-'+row).value.trim());
    toast(r.status==='linked' ? r.name+' was already in your list — marked as recommended' : 'Added '+r.name); loadToday(); }catch(e){ fail(e); }

function askButtons(c){
  if (c.status==='Closed') return '<span class="meta">Closed — no messages.</span>';
  return (c.askWaUrl?`<a class="btn primary" href="${c.askWaUrl}" target="_blank">Ask on WhatsApp</a>`:'')
    + (c.email && c.emailStatus!=='Bounced'?`<button class="btn ${c.askWaUrl?'':'primary'}" onclick="askEmail('${c.id}')">Ask by email</button>`:'')
    + `<button class="btn" onclick="askMark('${c.id}','WhatsApp')">Asked</button>`
    + `<button class="btn" onclick="askMark('${c.id}','Call')">Asked by phone</button>`;
}
function askCard(c){
  return `<div class="card" id="a-${c.id}">
    <p class="name" dir="auto" onclick="openContact('${c.id}')">${esc(c.name)}</p>
    <div class="meta" dir="auto">${metaLine(c)}</div>
    <div class="row">${askButtons(c)}<button class="btn quiet" onclick="askMark('${c.id}','skip')">Not now</button></div>
  </div>`;
}
async function askEmail(id){
  if(!confirm('Send the short “any shadchanim you’d recommend?” email now?')) return;
  try{ await run('api_askEmail', id); toast('Asked by email — their answer will show up in Today'); refreshAfterAsk(id); }catch(e){ fail(e); }
}
async function askMark(id, how){
  try{ await run('api_askMark', id, how); toast(how==='skip'?'OK, not now':'Saved'); refreshAfterAsk(id); }catch(e){ fail(e); }
}
function refreshAfterAsk(id){
  if (T){ T.asks = T.asks.filter(x=>x.id!==id); if (CARDS[id]) CARDS[id].asked = todayStr(); renderToday(); }

async function pasteExtract(id){

function notFit(id){ const el = $('#nf-' + id); if (!el) return;
  el.innerHTML = `<label>Why not for you?</label><div class="actions">${NF_REASONS.map(r => `<button class="btn" onclick="act('${id}','notfit','',${esc(JSON.stringify('Not for me: ' + r))})">${esc(r)}</button>`).join('')}</div>`; }
async function asideAgree(id){ const c = T.aside.find(x => x.id === id); await act(id, 'notfit', '', 'Not for us: ' + ((c && c.asideWhy) || '') + (c ? ' (' + c.asideBy + ')' : '')); T.aside = T.aside.filter(x => x.id !== id); renderToday(); }
async function asideKeep(id){ try { await run('api_saveContact', id, {Helpers: ''}); T.aside = T.aside.filter(x => x.id !== id); toast('Kept — back on the helpers\' list'); renderToday(); } catch(e){ fail(e); } }
async function act(id, action, channel, note){
  if (busy) return; busy=true;
  document.querySelectorAll('button.btn').forEach(b=>b.disabled=true);
  try{
    const nb = noteEl(id);
    if (!note && nb) note = nb.value.trim();
    const c = remember(await run('api_result', id, action, channel, note||'', ''));
    const labels={sent:'Marked as sent',spoke:'Saved — spoke',noreach:'Saved — will try again',later:'Moved to later',wrong:'Closed — wrong number',stop:'Added to Do not contact',answered:'Saved',wroteback:'Saved — they wrote back',reopen:'Reopened',notfit:'Set aside — not a fit'};
    toast(labels[action]||'Saved');
    updateTodayCard(c);
    if (sheetId===id) openContact(id);
  }catch(e){ fail(e); }
  finally{ busy=false; document.querySelectorAll('button.btn').forEach(b=>b.disabled=false); }
}
function noteBox(id, pre){ pre = pre||'n-';
  return `<div class="notebox"><input id="${pre}${id}" dir="auto" placeholder="Note (optional)" title="Saved with the result you tap" aria-label="Note">
    <button class="btn quiet" onclick="saveNote('${id}')">Save note</button></div>`;
}
/* The note box for this person: the open card's one first, else the Today card's. */
function noteEl(id){ return (sheetId===id && $('#sheet').classList.contains('open') && $('#sn-'+id)) || $('#n-'+id); }
async function saveNote(id){
  const nb=noteEl(id), t=nb && nb.value.trim(); if(!t) return toast('Type a note first');
  try{ const c = remember(await run('api_addNote', id, t)); nb.value=''; toast('Note saved');
    if (sheetId===id) openContact(id); }catch(e){ fail(e); }
}
/* After a tap: change only this person's place in Today, without asking the server again. */
function updateTodayCard(c){
  if (!T || !c) return;
  const swap = list => list.map(x => x.id===c.id ? c : x);
  T.call = swap(T.call); T.wa = swap(T.wa);
  T.replies = c.needsReply ? (T.replies.some(x=>x.id===c.id) ? swap(T.replies) : [c, ...T.replies]) : T.replies.filter(x=>x.id!==c.id);
  T.checkins = c.doneToday ? T.checkins.filter(x=>x.id!==c.id) : swap(T.checkins);
  T.asks = c.status==='Talking' && !c.asked && !c.needsReply ? swap(T.asks) : T.asks.filter(x=>x.id!==c.id);
  renderToday();
}
function stop(id, channel){ if(confirm('Never contact this person again (phone, WhatsApp and email)?')) act(id,'stop',channel); }

function copyText(text){
  if (navigator.clipboard && navigator.clipboard.writeText){
    return navigator.clipboard.writeText(text).then(()=>true).catch(()=>fallbackCopy(text));
  }
  return Promise.resolve(fallbackCopy(text));
}
function fallbackCopy(text){
  const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select(); let ok=false; try{ ok=document.execCommand('copy'); }catch(e){}
  ta.remove(); return ok;
}
async function copyRefs(lang){
  const t = references[lang] || references.HE || references.EN || '';
  if (!t) return toast('No references saved yet');
  const ok = await copyText(t);
  toast(ok ? 'References copied' : 'Copy blocked here');
}
async function copyProfile(lang){
  const ok = await copyText(profiles[lang]||profiles.HE);
  toast(ok ? 'Profile copied — paste it in WhatsApp' : 'Copy blocked here — open the contact and select the profile text');
}

const CARDS = {}, HIST = {};
let sheetId = null, histReq = 0;
function remember(c){ if (c && c.id){ const old = CARDS[c.id]; if (old && old.rank !== undefined && c.rank === undefined) c.rank = old.rank; CARDS[c.id] = hydrate(c); } return c; }
function fillHist(h){
  const box=$('#histBox'); if (box) box.innerHTML = histHtml(h);
  const top=$('#histTop'); if (top) top.innerHTML = histHtml(h && h.slice(0,3)) + (h && h.length>3 ? `<button class="btn quiet morehist" onclick="setTab('details')">All history (${h.length})</button>` : '');
}
let sheetTab = 'basic';
function setTab(t){ sheetTab=t; $('#sheet').dataset.tab=t; document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on', b.dataset.t===t)); $('#sheet').scrollTop=0; }
function histHtml(h){
  if (!h) return '<div class="loading">Loading history…</div>';
  return h.length ? h.map(x=>`<div class="hist" dir="auto"><b>${esc(x.when)}</b> · ${esc(x.channel)} · ${esc(x.action)}${x.details?'<br>'+esc(x.details):''}</div>`).join('') : '<div class="empty">Nothing yet.</div>';
}
async function openContact(id){
  const sameOpen = sheetId===id && $('#sheet').classList.contains('open');
  sheetId = id; markSel();
  $('#sheet').classList.add('open');
  const req = ++histReq;
  if (CARDS[id]) renderSheet(CARDS[id], sameOpen);
  else $('#sheetInner').innerHTML = '<div class="loading">Loading…</div>';
  try{
    if (CARDS[id]){
      const h = await run('api_history', id);
      if (req!==histReq) return;
      HIST[id] = h; fillHist(h);
    } else {
      const c = await run('api_contact', id);
      if (req!==histReq) return;
      HIST[id] = c.history; remember(c); renderSheet(c);
    }
  }catch(e){ fail(e); }
}

function markSel(){ document.querySelectorAll('.crow').forEach(r=>r.classList.toggle('sel', r.dataset.id===sheetId)); }
function closeSheet(){ $('#sheet').classList.remove('open'); sheetId = null; histReq++; markSel(); }
const wide = () => matchMedia('(min-width:900px)').matches;
/* Keys: Esc closes the card; on PC, up/down arrows move through the contact list. */
document.addEventListener('keydown', e=>{
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) { if (e.key==='Escape') e.target.blur(); return; }
  if (e.key==='Escape' && $('#sheet').classList.contains('open')) { closeSheet(); return; }
  if ((e.key==='ArrowDown'||e.key==='ArrowUp') && wide() && !$('#v-contacts').hidden){
    const rows=[...document.querySelectorAll('#clist .crow')]; if(!rows.length) return;
    let i=rows.findIndex(r=>r.dataset.id===sheetId); i = i<0 ? 0 : Math.max(0, Math.min(rows.length-1, i+(e.key==='ArrowDown'?1:-1)));
    e.preventDefault(); rows[i].scrollIntoView({block:'nearest'}); openContact(rows[i].dataset.id);
  }
});
async function saveContact(id){
  try{
    const c = await run('api_saveContact', id, {NextDate:$('#f-next').value, Lang:$('#f-lang').value, Notes:$('#f-notes').value, Helpers:$('#f-helpers') ? $('#f-helpers').value : undefined, Country:$('#f-country') ? $('#f-country').value : undefined});
    toast('Saved'); HIST[id] = c.history; remember(c); updateTodayCard(c);
    if (sheetId===id) renderSheet(c, true);

}

/* ---------- Contacts (everyone loaded once; filter/sort/search on the device) ---------- */
let DIR = null, dirReq = null, cShown = 60, qTimer = null;
const cTags = new Set();
function srcGroup(src){
  let g = String(src||'').split(/\s[–—-]\s|[:(]/)[0].replace(/\s*(p\.?|page|עמ['׳]?)?\s*\d[\d\s,.-]*$/i,'').trim();
  if (/^(insert|book)\b|שדכנים חדשים|ספר/i.test(g)) return 'Book';  // the insert sheet is part of the book
  return g || 'Other';
}
function hydrate(c){
  if (DIR && c && !c.waUrl){
    const m = (c.phones||[]).find(p=>p.mobile);
    if (m){ const intl = m.tel.replace(/\D/g,'');
      c.waUrl = 'https://api.whatsapp.com/send?phone='+intl+'&text='+encodeURIComponent(c.waText || DIR.wa[c.lang] || DIR.wa.HE);
      c.askWaUrl = 'https://api.whatsapp.com/send?phone='+intl+'&text='+encodeURIComponent(DIR.ask[c.lang] || DIR.ask.HE); }
  }
  return c;
}
async function ensureDir(force){
  if (DIR && !force && Date.now()-DIR.loadedAt < 10*60000){ renderContacts(); return; }
  if (!DIR) $('#clist').innerHTML = '<div class="loading">Loading contacts…</div>';
  if (!dirReq) dirReq = run('api_directory').then(d=>{
    d.loadedAt = Date.now(); d.ids = d.items.map(c=>c.id);
    DIR = d; d.items.forEach(remember);
    delete d.items; dirReq = null;
  }, e=>{ dirReq = null; throw e; });
  try{ await dirReq; if (!$('#v-contacts').hidden) renderContacts(); }catch(e){ fail(e); }
}
/* filters: one Filters button opens a sheet (bottom on phone, side on PC); the list updates as you tick; tags above the list remove one filter */
const F_TAGS = [['lang','Language',[['ru','Russian speakers'],['en','English']]], ['comm','Community',[['chabad','Chabad'],['bt','Baalei teshuva']]],
  ['loc','Location',[['near','Near Tzfat']]], ['reach','Can reach by',[['wa','WhatsApp'],['mail','Email']]]];
const F_WHO = [['shadchan','Shadchanim'],['connector','Connectors'],['all','Everyone']];
const F_LABEL = {}; F_TAGS.forEach(g => g[2].forEach(o => F_LABEL[o[0]] = o[1]));
let cWho = 'shadchan', cSort = '', fOpen = false;
const cSrcs = new Set(), cCtry = new Set();
try { const o = JSON.parse(localStorage.getItem('c_fl') || '{}');
  (o.tags || []).forEach(x => F_LABEL[x] && cTags.add(x)); (o.srcs || []).forEach(x => cSrcs.add(x)); (o.ctry || []).forEach(x => cCtry.add(x));
  if (F_WHO.some(w => w[0] === o.who)) cWho = o.who; cSort = o.sort || ''; } catch(e){}
function saveF(){ try { localStorage.setItem('c_fl', JSON.stringify({tags:[...cTags], srcs:[...cSrcs], ctry:[...cCtry], who:cWho, sort:cSort})); } catch(e){} }
// country: the contact's Country field, else from the phone code
const CTRY = [['Israel',/^(israel|isr|il|ישראל|израиль)$/],['USA',/^(usa|us|u\.s\.a?\.?|united states|america|сша|ארה"?ב|ארה״ב|ארצות הברית)$/],['Canada',/^(canada|канада|קנדה)$/],
  ['UK',/^(uk|u\.k\.|england|united kingdom|great britain|англия|великобритания|אנגליה|בריטניה)$/],['Russia',/^(russia|россия|רוסיה)$/],['Ukraine',/^(ukraine|украина|אוקראינה)$/],['France',/^(france|франция|צרפת)$/]];
function countryOf(c){
  const s = String(c.country || '').trim();
  if (s) { const m = CTRY.find(x => x[1].test(s.toLowerCase())); return m ? m[0] : s; }
  const d = String(((c.phones || [])[0] || {}).tel || '').replace(/\D/g, '');
  return /^972/.test(d) ? 'Israel' : /^1/.test(d) ? 'USA' : 'Unknown';
}
function whoOk(c){
  const t = c.type || 'Shadchan';
  return cWho === 'all' || (cWho === 'connector' ? t === 'Connector' : t === 'Shadchan');
}
function showOk(c, show){
  const st = c.status || 'New';
  if (show==='ready') return st==='New' && !c.blocked && (!c.type || c.type==='Shadchan');
  if (show==='closed') return st==='Closed' || c.blocked;
  if (show==='all') return true;
  return st.toLowerCase()===show && !c.blocked;
}
function tagTest(c, k){
  const w = c.why||[], ph = c.phones||[], il = ph.some(p=>/^tel:\+972/.test(p.tel));
  switch (k){
    case 'ru': return !!c.ru;
    case 'chabad': return w.indexOf('Chabad')>=0;
    case 'bt': return w.indexOf('Baalei teshuva')>=0;
    case 'en': return c.lang==='EN';
    case 'il': return il;
    case 'abroad': return !il && ph.length>0;
    case 'near': return w.some(x=>x==='Nearby'||/^In /.test(x));
    case 'wa': return ph.some(p=>p.mobile);
    case 'mail': return !!c.email;
  }
  return true;
}
/* any ticked option inside a group may match; every group must match. skip = leave one group out (for its counts) */
function fPass(c, skip){
  for (const g of F_TAGS){
    if (g[0] === skip) continue;
    const on = g[2].filter(o => cTags.has(o[0]));
    if (on.length && !on.some(o => tagTest(c, o[0]))) return false;
  }
  if (skip !== 'ctry' && cCtry.size && !cCtry.has(countryOf(c))) return false;
  return skip === 'src' || !cSrcs.size || cSrcs.has(srcGroup(c.source));
}
function fBase(){ const show = $('#cshow').value; return DIR ? DIR.ids.map(id=>CARDS[id]).filter(c => c && whoOk(c) && showOk(c, show)) : []; }
function fCount(){ return cTags.size + cSrcs.size + cCtry.size + (cWho !== 'shadchan' ? 1 : 0); }
function sortNow(){ const show = $('#cshow').value; return cSort || (show==='talking'||show==='contacted' ? 'last' : show==='later' ? 'next' : 'best'); }
function renderFBar(){
  const n = fCount(), s = sortNow(), q = $('#q').value.trim();
  $('#fwrap').hidden = !!q;
  $('#fbar').innerHTML = `<button class="${n?'on':''}" onclick="openFilters()">Filters${n?' ('+n+')':''}</button>
    <select id="csort" aria-label="Sort" onchange="cSort=this.value;saveF();resetPaging()">${[['best','Best first'],['name','Name'],['last','Last contact'],['next','Next date']]
      .map(o=>`<option value="${o[0]}" ${s===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>
    <button class="${cTags.has('ru')?'on':''}" onclick="fToggle('ru')">Russian</button>
    <button class="${cTags.has('wa')?'on':''}" onclick="fToggle('wa')">WhatsApp</button>`;
  // the other filters (no quick button): one text line that opens the Filters sheet; nothing disappears on a stray tap
  const on = [['who', cWho !== 'shadchan' ? [F_WHO.find(w=>w[0]===cWho)[1]] : []], ['ctry', [...cCtry]],
    ...F_TAGS.map(g => [g[0], g[2].filter(o => cTags.has(o[0]) && o[0] !== 'ru' && o[0] !== 'wa').map(o => o[1])]), ['src', [...cSrcs]]].filter(g => g[1].length);
  const names = [].concat(...on.map(g => g[1]));
  $('#fchips').innerHTML = !on.length ? '' : `<button class="fline" aria-label="${esc('Filters on: ' + names.join(', ') + '. Change')}" onclick="openFilters('${on[0][0]}')"><span class="t">Filters: ${names.map(x => `<bdi>${esc(x)}</bdi>`).join(', ')} · <u>Change</u></span></button><button class="quiet" onclick="fClear()">Clear all</button>`;
}
function fChanged(){ saveF(); resetPaging(); fUpdate(); }
function fToggle(k){ cTags.has(k) ? cTags.delete(k) : cTags.add(k); fChanged(); }
function fCtry(v){ cCtry.has(v) ? cCtry.delete(v) : cCtry.add(v); fChanged(); }
function fSrc(v){ cSrcs.has(v) ? cSrcs.delete(v) : cSrcs.add(v); fChanged(); }
function fWho(v){ cWho = v; fChanged(); }
function fClear(){ cTags.clear(); cSrcs.clear(); cCtry.clear(); cWho = 'shadchan'; fChanged(); }
function fSheetHtml(){
  const base = fBase(), srcs = {}; base.forEach(c => { const g = srcGroup(c.source); srcs[g] = (srcs[g]||0) + 1; });
  cSrcs.forEach(v => srcs[v] = srcs[v] || 0);
  const cn = {}; base.forEach(c => { const k = countryOf(c); cn[k] = (cn[k]||0) + 1; }); cCtry.forEach(v => cn[v] = cn[v] || 0);
  const opt = (type, g, v, label, js) => `<label class="fopt" data-g="${g}" data-v="${esc(v)}"><input type="${type}" name="f-${g}" onchange="${js}"><span dir="auto">${esc(label)}</span><small></small></label>`;
  let h = `<div class="fs-head"><b>Filters</b><button class="btn primary" onclick="closeFilters()">Done</button></div><div class="fs-body">`;
  h += `<h4 data-g="who">Who</h4>` + F_WHO.map(w => opt('radio', 'who', w[0], w[1], `fWho('${w[0]}')`)).join('');
  const cks = Object.keys(cn).sort((a,b) => (a==='Unknown') - (b==='Unknown') || cn[b]-cn[a]);
  if (cks.length > 1) h += `<h4 data-g="ctry">Country</h4>` + cks.map(v => opt('checkbox', 'ctry', v, v, `fCtry(${esc(JSON.stringify(v))})`)).join('');
  F_TAGS.forEach(g => { h += `<h4 data-g="${g[0]}">${g[1]}</h4>` + g[2].map(o => opt('checkbox', g[0], o[0], o[1], `fToggle('${o[0]}')`)).join(''); });
  h += `<h4 data-g="src">Where they came from</h4>` + Object.keys(srcs).sort((a,b)=>srcs[b]-srcs[a]).map(v => opt('checkbox', 'src', v, v, `fSrc(${esc(JSON.stringify(v))})`)).join('');
  return h + `</div><div class="fs-foot"><button class="btn" onclick="fClear()">Reset</button><button class="btn primary" id="fshow" onclick="closeFilters()"></button></div>`;
}
function fUpdate(){   // counts and ticks in place, nothing is rebuilt
  if (!fOpen) return;
  const base = fBase();
  document.querySelectorAll('#fsheet .fopt').forEach(el => {
    const g = el.dataset.g, v = el.dataset.v; let on, n = null;
    if (g === 'who') on = cWho === v;
    else if (g === 'ctry'){ on = cCtry.has(v); n = base.filter(c => fPass(c, 'ctry') && countryOf(c) === v).length; }
    else if (g === 'src'){ on = cSrcs.has(v); n = base.filter(c => fPass(c, 'src') && srcGroup(c.source) === v).length; }
    else { on = cTags.has(v); n = base.filter(c => fPass(c, g) && tagTest(c, v)).length; }
    el.querySelector('input').checked = on;
    el.querySelector('small').textContent = n == null ? '' : n; el.classList.toggle('zero', n === 0);
  });
  const k = base.filter(c => fPass(c)).length;
  $('#fshow').textContent = `Show ${k} ${k===1?'person':'people'}`;
}
function openFilters(g){
  if (fOpen || !DIR) return; fOpen = true;
  const sh = document.createElement('div'); sh.id = 'fshade'; sh.onclick = closeFilters; document.body.appendChild(sh);
  const el = document.createElement('div'); el.id = 'fsheet'; el.setAttribute('role','dialog'); el.setAttribute('aria-modal','true'); el.innerHTML = fSheetHtml(); document.body.appendChild(el);
  document.body.classList.add('flock'); fUpdate();
  try { history.pushState({fsheet:1}, ''); } catch(e){}
  el.querySelector('.fs-head button').focus();
  const h4 = g && el.querySelector('h4[data-g="' + g + '"]'); if (h4) h4.scrollIntoView({block: 'start'});
}
function hideFilters(){
  if (!fOpen) return; fOpen = false;
  ['#fsheet','#fshade'].forEach(x => { const e = $(x); if (e) e.remove(); });
  document.body.classList.remove('flock');
}
function closeFilters(){   // Done / outside tap / Esc go back one step, so the phone's back button stays in sync
  if (!fOpen) return;
  if (history.state && history.state.fsheet){ try { history.back(); return; } catch(e){} }
  hideFilters();
}
window.addEventListener('popstate', hideFilters);
document.addEventListener('keydown', e => { if (fOpen && e.key === 'Escape'){ e.stopImmediatePropagation(); closeFilters(); } }, true);
function renderContacts(){
  if (!DIR) return;
  const q = $('#q').value.trim().toLowerCase(), show = $('#cshow').value, sort = sortNow();
  renderFBar();
  const all = DIR.ids.map(id=>CARDS[id]).filter(Boolean);
  let base;
  if (q){
    const qd = q.replace(/\D/g,'');
    base = all.filter(c => (c.name+' '+(c.city||'')+' '+(c.email||'')+' '+(c.specialty||'')+' '+(c.referredBy||'')).toLowerCase().indexOf(q)>=0
      || (qd.length>=3 && (c.phones||[]).some(p=>p.local.replace(/\D/g,'').indexOf(qd.replace(/^972/,'0'))>=0)));
  } else base = all.filter(c => whoOk(c) && showOk(c, show) && fPass(c));
  let list = base;
  const by = {
    best: (a,b)=>((b.why||[]).indexOf('Chabad')>=0) - ((a.why||[]).indexOf('Chabad')>=0) || (b.rank||0)-(a.rank||0),   // Chabad on top
    name: (a,b)=>String(a.name).localeCompare(String(b.name),'he'),
    last: (a,b)=>String(b.lastContact||'').localeCompare(String(a.lastContact||'')),
    next: (a,b)=>(a.nextDate?0:1)-(b.nextDate?0:1) || String(a.nextDate||'').localeCompare(String(b.nextDate||''))
  };
  const xo = c => (c.why || []).indexOf('Crossed out in book') >= 0 ? 1 : 0;   // crossed out in the book: always last
  list = list.slice().sort((a, b) => xo(a) - xo(b) || (by[sort]||by.best)(a, b));
  $('#ccount').textContent = q ? `Searching everyone — ${list.length} found` : `${list.length} ${list.length===1?'person':'people'} here · ${all.length} contacts in total`;
  $('#clist').innerHTML = list.slice(0, cShown).map(rowHtml).join('')
    || `<div class="empty">${q?'No one matches that search.':'No one here right now.'}${!q && fCount() ? '<div style="margin-top:10px"><button class="btn" onclick="fClear()">Clear filters</button></div>' : ''}</div>`;
  $('#cmore').hidden = list.length <= cShown;
}
/* compact directory row (like ZugDesk): name, then city · status · last contact */
function rowHtml(c){
  const st = c.blocked && c.status!=='Closed' ? 'Do not contact' : c.status + (c.closeReason?' — '+c.closeReason:'');
  const bits = [c.city, st, c.lastContact && 'last '+String(c.lastContact).slice(0,10), c.nextDate && 'next '+c.nextDate].filter(Boolean).map(esc).join(' · ');

/* load more automatically when the end of the list comes into view */
new IntersectionObserver(es=>{ if (es[0].isIntersecting && !$('#cmore').hidden){ cShown += 60; renderContacts(); } }, {rootMargin:'600px'}).observe($('#cmore'));

    <p class="meta">Autopilot on/off is on the Email screen. Careful with the Autopilot values — the app follows them exactly.</p>
    ${secs.map(sec => `<h2>${esc(sec.title)}</h2><div class="card">${sec.items.map(field).join('')}</div>`).join('')}
    <div class="meta" id="app-state" style="margin-top:8px"></div>
    <div class="row"><button class="btn primary" onclick="saveApp()">Save</button></div>`;
  $('#sheet').scrollTop = 0;
}
function appEdit(el){
  const k = el.dataset.k;
  if (el.value === (FLAT[k] ? FLAT[k].value : '')) delete APPEDIT[k]; else APPEDIT[k] = el.value;
  $('#app-state').textContent = Object.keys(APPEDIT).length ? 'Not saved yet' : '';
}
async function saveApp(){
  if (busy) return; busy = true; lockButtons(true);
  try{
    const keys = Object.keys(APPEDIT), r = await run('api_saveSettings', APPEDIT);
    keys.forEach(k => { FLAT[k] = Object.assign({key:k, help:''}, FLAT[k], {value: APPEDIT[k]}); });
    APPEDIT = {}; toast(r.saved ? 'Saved' : 'Nothing changed');
    if (keys.length) loadToday();
    busy = false; renderAppSettings();
  }catch(e){ fail(e); }
  finally{ busy = false; lockButtons(false); }
}

loadToday();
</script>
</body>
</html>
